<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Print Version</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg: #fdfcfa;
            --text: #1a1614;
            --text-secondary: #6b6561;
            --accent: #d97706;
            --border: #e7e5e4;
            --code-bg: #faf8f6;
            --answer-bg: #fef3c7;
        }
        
        @page { size: A4; margin: 1.5cm; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 11pt;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }
        
        .header {
            border-bottom: 2px solid var(--text);
            padding-bottom: 0.75rem;
            margin-bottom: 2rem;
        }
        
        .header h1 {
            font-size: 24pt;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .header .meta {
            display: flex;
            justify-content: space-between;
            font-size: 9pt;
            color: var(--text-secondary);
            font-style: italic;
        }
        
        .section-header {
            margin-top: 2.5rem;
            margin-bottom: 1.5rem;
        }
        
        .section-header h2 {
            font-size: 16pt;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }
        
        .question {
            margin-bottom: 1.75rem;
            page-break-inside: avoid;
        }
        
        .question-number {
            font-size: 9pt;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        
        .question-text {
            font-size: 11pt;
            margin-bottom: 0.75rem;
        }
        
        .question-text pre {
            background: var(--code-bg);
            border-left: 3px solid var(--accent);
            padding: 0.75rem;
            margin: 0.75rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9pt;
        }
        
        .question-text code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9.5pt;
            background: var(--code-bg);
            padding: 0.1rem 0.3rem;
        }
        
        .options {
            margin-left: 1rem;
            margin-top: 0.5rem;
        }
        
        .option {
            margin-bottom: 0.4rem;
            display: flex;
        }
        
        .option-label {
            font-weight: 600;
            margin-right: 0.5rem;
            min-width: 1.5rem;
            color: var(--text-secondary);
        }
        
        .fib-answer-space {
            display: inline-block;
            min-width: 8rem;
            border-bottom: 1px solid var(--text);
            margin: 0 0.5rem;
            height: 1.2em;
        }
        
        .answer-key {
            margin-top: 3rem;
            page-break-before: always;
        }
        
        .answer-key h2 {
            font-size: 18pt;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--text);
            padding-bottom: 0.5rem;
        }
        
        .answer-item {
            margin-bottom: 1.25rem;
            padding: 0.75rem;
            background: var(--answer-bg);
            border-radius: 4px;
            page-break-inside: avoid;
        }
        
        .answer-number {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }
        
        .answer-text {
            font-size: 10pt;
        }
        
        .explanation {
            font-size: 9.5pt;
            color: var(--text-secondary);
            font-style: italic;
            margin-top: 0.25rem;
        }
        
        .passage-container {
            background: var(--code-bg);
            border-left: 3px solid var(--accent);
            padding: 0.75rem;
            margin: 0.75rem 0;
            line-height: 1.8;
            font-size: 10.5pt;
        }
        
        .passage-blank {
            display: inline-block;
            min-width: 4rem;
            border-bottom: 1px solid var(--text);
            margin: 0 0.25rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 id="quiz-title">Quiz</h1>
            <div class="meta">
                <span id="quiz-date"></span>
                <span id="quiz-total"></span>
            </div>
        </div>
        
        <div class="section-header">
            <h2>Questions</h2>
        </div>
        <div id="questions-container"></div>
        
        <div class="answer-key">
            <h2>Answer Key</h2>
            <div id="answers-container"></div>
        </div>
    </div>
    
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const topic = urlParams.get('topic') || urlParams.get('quiz');
        
        if (!topic) {
            document.body.innerHTML = '<h1>Error: No topic specified</h1>';
        } else {
            loadQuiz(topic);
        }
        
        function formatCode(text) {
            return (text || '').replace(/```java\n([\s\S]*?)\n```/g, '<pre><code>$1</code></pre>')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>');
        }
        
        async function loadQuiz(topic) {
            const res = await fetch(`${topic}.json`);
            const questions = await res.json();
            const title = topic.replace(/-/g, ' ').split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ') + ' Quiz';
            
            document.getElementById('quiz-title').textContent = title;
            document.getElementById('quiz-date').textContent = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
            document.getElementById('quiz-total').textContent = `Total Questions: ${questions.length}`;
            document.title = title;
            
            const qCont = document.getElementById('questions-container');
            const aCont = document.getElementById('answers-container');
            
            questions.forEach((q, i) => {
                const qDiv = document.createElement('div');
                qDiv.className = 'question';
                qDiv.innerHTML = `<div class="question-number">Question ${i+1}</div><div class="question-text">${formatCode(q.question)}</div>`;
                
                if (q.type === 'fib') {
                    qDiv.innerHTML += '<div><strong>Answer:</strong> <span class="fib-answer-space"></span></div>';
                } else if (q.type === 'passageFib') {
                    let p = q.passage.replace(/________/g, (_, n=0) => `(${n++}) <span class="passage-blank">________</span>`);
                    qDiv.innerHTML += `<div class="passage-container">${p}</div>`;
                } else {
                    let opts = '<div class="options">';
                    q.options.forEach((o, j) => opts += `<div class="option"><span class="option-label">${String.fromCharCode(65+j)}.</span><span>${formatCode(o)}</span></div>`);
                    qDiv.innerHTML += opts + '</div>';
                }
                qCont.appendChild(qDiv);
                
                const aDiv = document.createElement('div');
                aDiv.className = 'answer-item';
                let ans = '';
                if (q.type === 'fib') {
                    ans = `<strong>Answer:</strong> ${Array.isArray(q.answer) ? q.answer.join(' or ') : q.answer}`;
                } else if (q.type === 'passageFib') {
                    ans = '<strong>Answers:</strong> ' + Object.keys(q.answer).sort((a,b)=>a-b).map(k => `(${k}) ${Array.isArray(q.answer[k]) ? q.answer[k].join(' or ') : q.answer[k]}`).join(', ');
                } else {
                    ans = `<strong>Answer:</strong> ${String.fromCharCode(65+q.answer)}. ${q.options[q.answer]}`;
                }
                aDiv.innerHTML = `<div class="answer-number">Question ${i+1}</div><div class="answer-text">${ans}</div>` + (q.explanation ? `<div class="explanation">${formatCode(q.explanation)}</div>` : '');
                aCont.appendChild(aDiv);
            });
        }
    </script>
</body>
</html>
