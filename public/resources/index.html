<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHS PYQP - Quizzes</title>
    <script src="https://kit.fontawesome.com/d63d2ac69c.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="/style.css">
    <link rel="icon" type="image/png" href="../logo.png" />
    <style>
        :root {
            --bg: #040b15;
            --bg-secondary: #0c1420;
            --primary: #93bbea;
            --secondary: #921e1c;
            --accent: #d6b329;
            --text: #e5f0fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Urbanist, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        body > h1 {
            margin-bottom: 5px;
            color: var(--secondary);
            text-shadow: var(--accent);
            text-align: center;
            padding: 20px;
        }

        main {
            display: flex;
            color: var(--text);
            height: 84vb;
        }

        #left {
            width: 50vi;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            text-align: center;
            justify-content: center;
            align-items: center;
            overflow: scroll;
        }

        #back {
            display: none;
            background: var(--secondary);
            border: 2px solid var(--accent);
            color: var(--text);
            width: 38vi;
            height: 8vi;
            margin: 2vi;
            transition: ease-in-out 100ms;
            border-radius: 16px;
            padding: 0.5vi;
            cursor: pointer;
            font-size: 1.2rem;
        }

        #back:hover {
            scale: 1.1;
        }

        #content {
            width: 100%;
            display: flex;
            flex-wrap: inherit;
            justify-content: inherit;
        }

        .card {
            background: var(--primary);
            width: 12vi;
            height: 16vi;
            margin: 2vi;
            transition: ease-in-out 100ms;
            border-radius: 16px;
            padding: 1vi;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .card:hover {
            scale: 1.2;
            box-shadow: 0 8px 12px rgba(147, 187, 234, 0.4);
        }

        .card.class-card > h2 {
            font-size: 4vi;
            color: var(--bg);
            font-weight: 600;
        }

        .card.class-card > p {
            font-size: 0.8rem;
            color: rgba(4, 11, 21, 0.7);
            font-weight: 500;
        }

        .card.subject-card,
        .card.topic-card {
            background: linear-gradient(135deg, var(--primary), rgba(147, 187, 234, 0.8));
        }

        .card > i {
            scale: 2.5;
            margin-bottom: 10%;
            color: var(--bg);
        }

        .card > h3 {
            font-size: 1.1rem;
            color: var(--bg);
            font-weight: 600;
            text-align: center;
            word-wrap: break-word;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            /* -webkit-line-clamp: 2; */
            -webkit-box-orient: vertical;
        }

        #loading {
            width: 12vi;
            height: 12vi;
            border-radius: 50%;
            display: none;
            position: relative;
            background: linear-gradient(0deg, rgba(255, 61, 0, 0.2) 33%, var(--accent) 100%);
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        #loading::after {
            content: '';
            box-sizing: border-box;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 11vi;
            height: 11vi;
            border-radius: 50%;
            background: #263238;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg) }
            100% { transform: rotate(360deg) }
        }

        #noContent {
            color: var(--secondary);
            font-size: 1.2rem;
            font-weight: 500;
        }

        footer {
            background: var(--secondary);
            width: 80vi;
            margin-left: 9vi;
            border-radius: 16px;
            padding: 1vi;
            text-align: center;
            color: var(--text);
        }

        footer > h1 {
            font-family: "Parisienne", cursive;
            font-weight: bolder;
        }

        footer a {
            color: white;
            font-size: 3rem;
            text-decoration: none;
        }

        footer p {
            font-family: "Urbanist", sans-serif;
        }

        #logo {
            width: 50vi;
            vertical-align: middle;
            text-align: center;
        }

        #logo-img {
            height: 40vi;
            width: 40vi;
            border: 8vi solid var(--accent);
            border-radius: 100vb;
            margin-top: 10%;
            margin-bottom: 5%;
        }

        .mobileOnly {
            display: none;
        }

        .fillout-embed-popup-button-45122879619980 {
            width: 50vi !important;
            background: var(--secondary) !important;
            border-radius: 16px !important
        }

        @media (max-width: 719px) {
            #logo {
                display: none;
            }

            body {
                background: var(--bg);
                text-align: center;
            }

            main {
                flex-direction: column;
            }

            #left {
                height: 80vb;
                display: flex;
                flex-wrap: wrap;
                text-align: center;
                justify-content: center;
                align-items: center;
                overflow: scroll;
                width: 100%;
            }

            #back {
                display: none;
                background: var(--secondary);
                border: 2px solid var(--accent);
                color: var(--text);
                width: 72vi;
                height: 8vi;
                margin: 2vi;
                transition: ease-in-out 100ms;
                border-radius: 16px;
                padding: 0.5vi;
                cursor: pointer;
            }

            #back:hover {
                scale: 1.2;
            }

            .classes, .quizzes {
                background: var(--primary);
                width: 32vi;
                height: 32vi;
                margin: 2vi;
                transition: ease-in-out 100ms;
                border-radius: 16px;
                padding: 0.5vi;
                padding-top: 6vi;
                padding-bottom: 1vi;
                cursor: pointer;
            }

            .classes:hover, .quizzes:hover {
                scale: 1.2;
            }

            .classes > h2 {
                font-size: 8vi;
            }

            .quizzes > i {
                scale: 3;
                margin-top: 30%;
            }

            footer {
                background: var(--secondary);
                width: 95vi;
                margin-left: 0.8vi;
                border-radius: 16px;
                text-align: center;
                color: var(--text);
            }

            .mobileOnly {
                display: block;
            }
        }
    </style>
</head>
<body>
    <h1>SHS-PYQP Quizzes</h1>
    <main>
        <div id="left">
            <button id="back"><i style="scale: 3;" class="fa-solid fa-arrow-left"></i></button>
            <br>
            <div id="loading" class="loader"></div>
            <div id="content"></div>
        </div>
        <div id="logo">
            <img src="../logo.png" id="logo-img">
            <div data-fillout-id="fomnXDhaxYus" data-fillout-embed-type="popup"
                data-fillout-button-text="Contribute a Paper" data-fillout-dynamic-resize
                data-fillout-button-color="#921E1C" data-fillout-inherit-parameters data-fillout-popup-size="medium">
            </div>
            <script src="https://server.fillout.com/embed/v1/"></script>
        </div>
    </main>

    <div class="mobileOnly" data-fillout-id="fomnXDhaxYus" data-fillout-embed-type="popup"
        data-fillout-button-text="Contribute a Paper" data-fillout-dynamic-resize data-fillout-button-color="#921E1C"
        data-fillout-inherit-parameters data-fillout-popup-size="medium"></div>
    <script src="https://server.fillout.com/embed/v1/"></script>

    <footer>
        <a href="https://github.com/Ritwik-Sh/SHS-PYQP-Project" class="fa-brands fa-github"></a>
        <h1>Credits</h1>
        <p>This Website was made By Ritwik Sharma</p>
        <p>Idea by Mayukh Awasthi</p>
        <br>
        <p>Special thanks to the contributors for providing quiz content</p>
        <br>
        <h2>Note</h2>
        <p>This project is not an Initiative by Sheiling House School</p>
        <p>We do not own any rights to the Sheiling House Logo</p>
    </footer>

    <script>
        // ===== SIMPLE QUIZ CONFIGURATION =====
        const QUIZZES = [
            {
                class: 10,
                subject: 'Computer Applications',
                icon: 'fa-code',
                topics: [
                    { name: 'Java MCQ', file: 'class-10-java.json' }
                ]
            },
            {
                class: 10,
                subject: 'Chemistry',
                icon: 'fa-flask',
                topics: [
                    { name: 'Mixed Bag MCQ', file: 'class-10-chem-mixed.json' }
                ]
            },
            {
                class: 10,
                subject: 'Environmental Science',
                icon: 'fa-tree',
                topics: [
                    { name: 'Environmental Science MCQ', file: 'class-10-evs-mixed.json' }
                ]
            },
            {
                class: 10,
                subject: 'Biology',
                icon: 'fa-dna',
                topics: [
                    { name: 'Plant Physiology MCQ', file: 'class-10-bio-plant-physiology.json' },
                    { name: 'Reproduction in Humans MCQ', file: 'class-10-bio-reproduction.json'},
                    { name: 'Genetics MCQ', file: 'class-10-bio-genetics.json' },
                    { name: 'Human Anatomy', file: 'class-10-bio-human-anatomy.json' }
                ]
            },
            {
                class: 10,
                subject: 'English Literature',
                icon: 'fa-book',
                topics: [
                    { name: 'Julius Caesar MCQ', file: 'class-10-eng-lit-jc.json' },
                    { name: 'The Elevator MCQ', file: 'class-10-eng-lit-the-elevator.json' },
                    { name: 'With The Photographer MCQ', file: 'class-10-eng-lit-With-The-Photographer.json' }
                ]
            },
            {
                class: 10,
                subject: 'English Language',
                icon: 'fa-pen-nib',
                topics: [
                    { name: 'Prepositions FIBs', file: 'class-10-eng-lang-prepositions.json' },
                    { name: 'Direct Indirect Speech MCQ', file: 'class-10-eng-lang-direct-indirect.json' }
                ]
            }
        ];

        // Navigation state management
        let navigationState = {
            view: 'classes', // 'classes', 'subjects', or 'topics'
            currentClass: null,
            currentSubject: null
        };

        // Back button handler
        document.getElementById('back').addEventListener('click', handleBack);

        function handleBack() {
            if (navigationState.view === 'topics') {
                // Go back to subjects view
                renderSubjects(navigationState.currentClass);
            } else if (navigationState.view === 'subjects') {
                // Go back to classes view
                renderClasses();
            }
        }

        function renderClasses() {
            const content = document.getElementById('content');
            content.innerHTML = '';
            document.querySelector('#back').style.display = 'none';
            
            // Update navigation state
            navigationState = {
                view: 'classes',
                currentClass: null,
                currentSubject: null
            };
            
            const classes = [...new Set(QUIZZES.map(q => q.class))].sort((a, b) => a - b);
            
            if (classes.length === 0) {
                content.innerHTML = '<h1 id="noContent">No Classes Available!</h1>';
                return;
            }

            classes.forEach(cls => {
                const card = document.createElement('div');
                card.className = 'card class-card';
                card.innerHTML = `<h2>${cls}</h2><p>Class ${cls}</p>`;
                card.onclick = () => renderSubjects(cls);
                content.appendChild(card);
            });
        }

        function renderSubjects(cls) {
            const content = document.getElementById('content');
            content.innerHTML = '';
            document.querySelector('#back').style.display = 'inline-block';

            // Update navigation state
            navigationState = {
                view: 'subjects',
                currentClass: cls,
                currentSubject: null
            };

            const subjects = QUIZZES.filter(q => q.class === cls);
            
            if (subjects.length === 0) {
                content.innerHTML = '<h1 id="noContent">No Subjects Available!</h1>';
                return;
            }

            subjects.forEach(subject => {
                const card = document.createElement('div');
                card.className = 'card subject-card';
                card.innerHTML = `
                    <i class="fa-solid ${subject.icon}"></i>
                    <h3>${subject.subject}</h3>
                `;
                card.onclick = () => renderTopics(cls, subject);
                content.appendChild(card);
            });
        }

        function renderTopics(cls, subject) {
            const content = document.getElementById('content');
            content.innerHTML = '';

            // Update navigation state
            navigationState = {
                view: 'topics',
                currentClass: cls,
                currentSubject: subject
            };

            if (subject.topics.length === 0) {
                content.innerHTML = '<h1 id="noContent">No Topics Available!</h1>';
                return;
            }

            subject.topics.forEach(topic => {
                const card = document.createElement('div');
                card.className = 'card topic-card';
                card.innerHTML = `
                    <i class="fa-solid fa-clipboard-list"></i>
                    <h3>${topic.name}</h3>
                `;
                card.onclick = () => {
                    window.open(`/resources/questions.html?topic=${topic.file}`, '_blank');
                };
                content.appendChild(card);
            });
        }

        // Initialize
        renderClasses();
    </script>
</body>
</html>
