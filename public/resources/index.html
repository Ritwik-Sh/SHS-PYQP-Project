<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHS-PYQP-Project: Resources</title>
    <link rel="shortcut icon" href="../logo.png" type="image/x-icon">
    <script src="https://kit.fontawesome.com/d63d2ac69c.js" crossorigin="anonymous"></script>
    <style>
        :root {
            --bg: #040b15;
            --bg-secondary: #0c1420;
            --primary: #93bbea;
            --secondary: #921e1c;
            --accent: #d6b329;
            --text: #e5f0fa;
            --success: #4ade80;
            --warning: #fbbf24;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Urbanist, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        body>h1 {
            margin-bottom: 5px;
            color: var(--secondary);
            text-align: center;
            padding: 20px;
            font-size: 2rem;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        main {
            display: flex;
            color: var(--text);
            min-height: 84vh;
            gap: 20px;
            padding: 0 20px;
        }

        #left {
            width: 50vw;
            height: 100%;
            display: flex;
            flex-wrap: wrap;
            text-align: center;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
            padding: 10px;
        }

        #back {
            display: none;
            background: var(--secondary);
            border: 2px solid var(--accent);
            color: var(--text);
            width: 38vw;
            height: 8vh;
            margin: 2vh;
            transition: ease-in-out 100ms;
            border-radius: 16px;
            padding: 0.5vh;
            cursor: pointer;
            font-size: 1.2rem;
        }

        #back:hover {
            scale: 1.05;
            background: rgba(146, 30, 28, 0.8);
        }

        #content {
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .card {
            background: linear-gradient(135deg, rgba(147, 187, 234, 0.1), rgba(147, 187, 234, 0.05));
            backdrop-filter: blur(10px);
            border: 1px solid rgba(147, 187, 234, 0.2);
            width: 170px;
            min-height: 160px;
            transition: all 300ms ease;
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 24px rgba(147, 187, 234, 0.3);
            border-color: var(--primary);
        }

        /* Status bar for quiz cards */
        .card.topic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: rgba(147, 187, 234, 0.3);
            transition: all 300ms ease;
        }

        .card.topic-card.complete::before {
            background: linear-gradient(90deg, var(--success), #22c55e);
        }

        .card.topic-card.incomplete::before {
            background: linear-gradient(90deg, var(--warning), var(--accent));
        }

        .card.topic-card.not-started::before {
            background: rgba(147, 187, 234, 0.3);
        }

        .card.class-card {
            background: linear-gradient(135deg, var(--primary), rgba(147, 187, 234, 0.7));
        }

        .card.class-card>h2 {
            font-size: 3.5rem;
            color: var(--bg);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .card.class-card>p {
            font-size: 0.9rem;
            color: rgba(4, 11, 21, 0.7);
            font-weight: 500;
        }

        .card.subject-card,
        .card.topic-card {
            background: linear-gradient(135deg, rgba(147, 187, 234, 0.15), rgba(147, 187, 234, 0.05));
        }

        .card>i {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .card>h3 {
            font-size: 1.1rem;
            color: var(--text);
            font-weight: 600;
            text-align: center;
            word-wrap: break-word;
            margin-bottom: 12px;
        }

        /* Progress indicators - removed badge, using top bar instead */

        .quiz-stats {
            width: 100%;
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid rgba(147, 187, 234, 0.2);
        }

        .quiz-stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 8px;
            color: rgba(229, 240, 250, 0.7);
        }

        .quiz-stats-row span:last-child {
            color: var(--primary);
            font-weight: 600;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(147, 187, 234, 0.1);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--primary));
            border-radius: 3px;
            transition: width 400ms ease;
        }

        .progress-bar-fill.incomplete {
            background: linear-gradient(90deg, var(--warning), var(--accent));
        }

        #loading {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: none;
            position: relative;
            background: linear-gradient(0deg, rgba(255, 61, 0, 0.2) 33%, var(--accent) 100%);
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
        }

        #loading::after {
            content: '';
            box-sizing: border-box;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: var(--bg);
        }

        @keyframes rotation {
            0% {
                transform: rotate(0deg)
            }

            100% {
                transform: rotate(360deg)
            }
        }

        #noContent {
            color: var(--secondary);
            font-size: 1.2rem;
            font-weight: 500;
        }

        footer {
            background: var(--secondary);
            width: 80vw;
            margin: 40px auto 20px;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            color: var(--text);
        }

        footer>h1 {
            font-family: "Parisienne", cursive;
            font-weight: bolder;
        }

        footer a {
            color: white;
            font-size: 3rem;
            text-decoration: none;
        }

        footer p {
            font-family: "Urbanist", sans-serif;
        }

        #logo {
            width: 50vw;
            vertical-align: middle;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #logo-img {
            height: 400px;
            width: 400px;
            border: 50px solid var(--accent);
            border-radius: 50%;
            margin-bottom: 30px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
        }

        .mobileOnly {
            display: none;
        }

        @media (max-width: 768px) {
            body>h1 {
                font-size: 1.5rem;
                padding: 15px;
            }

            main {
                flex-direction: column;
                min-height: auto;
                padding: 10px;
            }

            #left {
                width: 100%;
                padding: 10px;
            }

            #back {
                width: 90%;
                max-width: 300px;
                height: 50px;
                margin: 10px auto 20px;
                font-size: 1.1rem;
            }

            .card {
                width: calc(50% - 10px);
                min-width: 140px;
                max-width: 180px;
                min-height: 180px;
                padding: 15px;
            }

            .card.class-card>h2 {
                font-size: 2.5rem;
            }

            .card>i {
                font-size: 2rem;
            }

            .card>h3 {
                font-size: 0.9rem;
            }

            #logo {
                display: none;
            }

            #logo-img {
                height: 250px;
                width: 250px;
                border-width: 15px;
            }

            .mobileOnly {
                display: block;
                text-align: center;
                padding: 20px;
            }

            footer {
                width: 90%;
                padding: 20px 15px;
            }

            footer a {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 400px) {
            .card {
                width: calc(50% - 8px);
                min-width: 120px;
                max-width: 140px;
                min-height: 160px;
            }

            .card.class-card>h2 {
                font-size: 2rem;
            }

            .card>i {
                font-size: 1.8rem;
            }

            .card>h3 {
                font-size: 0.85rem;
            }
        }

        h1 a {
            color: inherit;
            text-decoration: inherit;
        }
    </style>
</head>

<body>
    <h1><a href="/../">SHS-PYQP-Project</a>: Resources</h1>
    <main>
        <div id="left">
            <button id="back"><i style="font-size: 1.5rem;" class="fa-solid fa-arrow-left"></i> Back</button>
            <br>
            <div id="loading" class="loader"></div>
            <div id="content"></div>
        </div>
        <div id="logo">
            <img src="../logo.png" id="logo-img" alt="SHS Logo">
            <div data-fillout-id="fomnXDhaxYus" data-fillout-embed-type="popup"
                data-fillout-button-text="Contribute a Paper" data-fillout-dynamic-resize
                data-fillout-button-color="#921E1C" data-fillout-inherit-parameters data-fillout-popup-size="medium">
            </div>
            <script src="https://server.fillout.com/embed/v1/"></script>
        </div>
    </main>

    <div class="mobileOnly" data-fillout-id="fomnXDhaxYus" data-fillout-embed-type="popup"
        data-fillout-button-text="Contribute a Paper" data-fillout-dynamic-resize data-fillout-button-color="#921E1C"
        data-fillout-inherit-parameters data-fillout-popup-size="medium"></div>
    <script src="https://server.fillout.com/embed/v1/"></script>

    <footer>
        <a href="https://github.com/Ritwik-Sh/SHS-PYQP-Project" class="fa-brands fa-github"></a>
        <h1>Credits</h1>
        <p>This Website was made By Ritwik Sharma</p>
        <p>Idea by Mayukh Awasthi</p>
        <br>
        <p>Special thanks to the contributors for providing quiz content</p>
        <br>
        <h2>Note</h2>
        <p>This project is not an Initiative by Sheiling House School</p>
        <p>We do not own any rights to the Sheiling House Logo</p>
    </footer>

    <script>
        const TYPE_ICONS = {
            'Quiz':     'fa-clipboard-list',
            'Video':    'fa-video',
            'Document': 'fa-file-lines',
            'Website':  'fa-globe'
        };

        const RESOURCES = [
            {
                class: 10,
                subject: 'Computer Applications',
                icon: 'fa-code',
                topics: [
                    { name: 'Java MCQ', file: 'class-10-java', type: 'Quiz' },
                    { name: 'MCQs', file: 'https://www.geeksforgeeks.org/java/java-multiple-choice-questions/', type: 'Quiz' },
                    { name: 'ICSE Java Coding Competition (With Very Good Questions)', file: 'https://www.hackerrank.com/icse-codilit-2026', type: 'Quiz' }
                ]
            },
            {
                class: 10,
                subject: 'Chemistry',
                icon: 'fa-flask',
                topics: [
                    { name: 'Mixed Bag MCQ', file: 'class-10-chem-mixed', type: 'Quiz' }
                ]
            },
            {
                class: 10,
                subject: 'Biology',
                icon: 'fa-dna',
                topics: [
                    { name: 'Plant Physiology MCQ', file: 'class-10-bio-plant-physiology', type: 'Quiz' },
                    { name: 'Genetics MCQ', file: 'class-10-bio-genetics', type: 'Quiz' },
                    { name: 'Human Anatomy', file: 'class-10-bio-human-anatomy', type: 'Quiz' },
                    { name: 'Endocrine System', file: 'https://www.youtube.com/watch?v=ySkk7U_4PeY', type: 'Video' }
                ]
            },
            {
                class: 10,
                subject: 'Physics',
                icon: 'fa-magnet',
                topics: [
                    { name: 'Mixed MCQs', file: 'class-10-phy-mixed', type: 'Quiz' }
                ]
            },
            {
                class: 10,
                subject: 'Environmental Science',
                icon: 'fa-tree',
                topics: [
                    { name: 'Environmental Science MCQ', file: 'class-10-evs-mixed', type: 'Quiz' }
                ]
            },
            {
                class: 10,
                subject: 'English Literature',
                icon: 'fa-book',
                topics: [
                    { name: 'Julius Caesar MCQ', file: 'class-10-eng-lit-jc', type: 'Quiz' },
                    { name: 'With The Photographer MCQ', file: 'class-10-eng-lit-With-The-Photographer', type: 'Quiz' }
                ]
            },
            {
                class: 10,
                subject: 'English Language',
                icon: 'fa-pen-nib',
                topics: [
                    { name: 'Prepositions FIBs', file: 'class-10-eng-lang-prepositions', type: 'Quiz' },
                    { name: 'ICSE Preposition Gauntlet (For Final Practice)', file: 'class-10-eng-lang-preposition-gauntlet', type: 'Quiz' },
                    { name: 'Phrasal Prepositions FIBs', file: 'class-10-eng-lang-prepositions-phrasal', type: 'Quiz' },
                    { name: 'Direct Indirect Speech MCQ', file: 'class-10-eng-lang-direct-indirect', type: 'Quiz' },
                    { name: 'Verb Passage FIBs', file: 'class-10-eng-lang-verb-passages', type: 'Quiz' }
                ]
            },
            {
                class: 10,
                subject: 'Mathematics',
                icon: 'fa-square-root-variable',
                topics: [
                    { name: 'Mixed Bag', file: 'class-10-maths-mixed', type: 'Quiz' }
                ]
            }
        ];

        let navigationState = {
            view: 'classes',
            currentClass: null,
            currentSubject: null
        };

        document.getElementById('back').addEventListener('click', handleBack);

        function handleBack() {
            if (navigationState.view === 'topics') {
                renderSubjects(navigationState.currentClass);
            } else if (navigationState.view === 'subjects') {
                renderClasses();
            }
        }

        // LocalStorage functions for progress tracking
        function getQuizProgress(topicFile) {
            // Normalize the topic name - remove .json if present
            const topic = topicFile.replace(/\.json$/, '');

            try {
                const saved = localStorage.getItem(`quizProgress_${topic}`);
                if (!saved) return null;

                const progress = JSON.parse(saved);
                return progress;
            } catch (e) {
                console.warn('Corrupt quiz data for topic:', topic, e);
                return null;
            }
        }

        function calculateProgress(progress, totalQuestions) {
            if (!progress) return { percentage: 0, status: 'not-started' };

            const answeredCount = Object.keys(progress.userAnswers || {}).length;
            const percentage = totalQuestions > 0 ? (answeredCount / totalQuestions) * 100 : 0;

            let status = 'not-started';
            if (percentage === 100) status = 'complete';
            else if (percentage > 0) status = 'incomplete';

            return { percentage, status, answeredCount, ...progress };
        }

        async function getQuizTotalQuestions(topicFile) {
            try {
                // Ensure the file has .json extension for fetching
                const jsonFile = topicFile.endsWith('.json') ? topicFile : `${topicFile}.json`;
                const response = await fetch(jsonFile);
                if (!response.ok) {
                    console.warn('Could not load quiz questions:', jsonFile, 'Status:', response.status);
                    return 0;
                }
                const questions = await response.json();
                return questions.length;
            } catch (error) {
                console.warn('Error loading quiz questions:', topicFile, error);
                return 0;
            }
        }

        function renderClasses() {
            const content = document.getElementById('content');
            content.innerHTML = '';
            document.querySelector('#back').style.display = 'none';

            navigationState = {
                view: 'classes',
                currentClass: null,
                currentSubject: null
            };

            const classes = [...new Set(RESOURCES.map(q => q.class))].sort((a, b) => a - b);

            if (classes.length === 0) {
                content.innerHTML = '<h1 id="noContent">No Classes Available!</h1>';
                return;
            }

            classes.forEach(cls => {
                const card = document.createElement('div');
                card.className = 'card class-card';
                card.innerHTML = `<h2>${cls}</h2><p>Class ${cls}</p>`;
                card.onclick = () => renderSubjects(cls);
                content.appendChild(card);
            });
        }

        function renderSubjects(cls) {
            const content = document.getElementById('content');
            content.innerHTML = '';
            document.querySelector('#back').style.display = 'inline-block';

            navigationState = {
                view: 'subjects',
                currentClass: cls,
                currentSubject: null
            };

            const subjects = RESOURCES.filter(q => q.class === cls);

            if (subjects.length === 0) {
                content.innerHTML = '<h1 id="noContent">No Subjects Available!</h1>';
                return;
            }

            subjects.forEach(subject => {
                const card = document.createElement('div');
                card.className = 'card subject-card';
                card.innerHTML = `
                    <i class="fa-solid ${subject.icon}"></i>
                    <h3>${subject.subject}</h3>
                `;
                card.onclick = () => renderTopics(cls, subject);
                content.appendChild(card);
            });
        }

        async function renderTopics(cls, subject) {
            const content = document.getElementById('content');
            content.innerHTML = '';

            navigationState = {
                view: 'topics',
                currentClass: cls,
                currentSubject: subject
            };

            if (subject.topics.length === 0) {
                content.innerHTML = '<h1 id="noContent">No Topics Available!</h1>';
                return;
            }

            // Render cards with loading state
            for (const topic of subject.topics) {
                const topicType = topic.type || 'Quiz';
                const typeIcon = TYPE_ICONS[topicType] || 'fa-clipboard-list';
                const card = document.createElement('div');
                card.className = 'card topic-card';
                const loadingStats = topicType === 'Quiz' ? `
                    <div class="quiz-stats">
                        <div class="quiz-stats-row">
                            <span>Loading...</span>
                        </div>
                    </div>` : '';
                card.innerHTML = `
                    <i class="fa-solid ${typeIcon}"></i>
                    <h3>${topic.name}</h3>
                    ${loadingStats}
                `;
                card.onclick = () => {
                    if (topicType === 'Quiz' && !topic.file.startsWith('http')) {
                        window.open(`/resources/questions.html?topic=${topic.file}`, '_blank');
                    } else {
                        window.open(topic.file, '_blank');
                    }
                };
                content.appendChild(card);

                // Load progress asynchronously for Quiz type only
                if (topicType === 'Quiz') {
                    loadTopicProgress(card, topic);
                }
            }
        }

        async function loadTopicProgress(card, topic) {
            // Get total questions from the JSON file
            const totalQuestions = await getQuizTotalQuestions(topic.file);

            // Get progress from localStorage (using normalized topic name without .json)
            const progress = getQuizProgress(topic.file);
            const progressData = calculateProgress(progress, totalQuestions);

            const answeredCount = progressData.answeredCount || 0;
            const correctCount = progress?.correctCount || 0;
            const percentage = progressData.percentage;

            // Add status class to card for top bar styling
            card.classList.add(progressData.status);

            let statsHTML = '';
            if (progressData.status !== 'not-started') {
                const statusText = progressData.status === 'complete' ? 'Complete' : 'In Progress';
                const accuracy = answeredCount > 0 ? Math.round((correctCount / answeredCount) * 100) : 0;

                statsHTML = `
                    <div class="quiz-stats">
                        <div class="quiz-stats-row">
                            <span>Status:</span>
                            <span>${statusText}</span>
                        </div>
                        <div class="quiz-stats-row">
                            <span>Progress:</span>
                            <span>${answeredCount}/${totalQuestions}</span>
                        </div>
                        <div class="quiz-stats-row">
                            <span>Score:</span>
                            <span>${correctCount}/${answeredCount}</span>
                        </div>
                        <div class="quiz-stats-row">
                            <span>Accuracy:</span>
                            <span>${accuracy}%</span>
                        </div>
                        <div class="progress-bar-container">
                            <div class="progress-bar-fill ${progressData.status === 'complete' ? '' : 'incomplete'}"
                                 style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
            } else {
                statsHTML = `
                    <div class="quiz-stats">
                        <div class="quiz-stats-row">
                            <span>Status:</span>
                            <span>Not Started</span>
                        </div>
                        <div class="quiz-stats-row">
                            <span>Questions:</span>
                            <span>${totalQuestions}</span>
                        </div>
                    </div>
                `;
            }

            card.innerHTML = `
                <i class="fa-solid fa-clipboard-list"></i>
                <h3>${topic.name}</h3>
                ${statsHTML}
            `;
        }

        renderClasses();
    </script>
</body>

</html>
