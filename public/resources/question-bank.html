<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Question Bank | SHS-PYQP-Project</title>
		<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
		<link rel="shortcut icon" href="../logo.png" type="image/x-icon" />
		<link
			rel="stylesheet"
			href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
		/>
		<style>
			:root {
				--bg: #040b15;
				--bg-secondary: #0c1420;
				--surface: #0c1420;
				--surface-raised: #111d2d;
				--primary: #93bbea;
				--secondary: #921e1c;
				--accent: #d6b329;
				--text: #e5f0fa;
				--text-muted: rgba(229, 240, 250, 0.5);
				--muted: #8ea2b9;
				--border: rgba(147, 187, 234, 0.25);
				--line: rgba(147, 187, 234, 0.2);
				--primary-subtle: rgba(147, 187, 234, 0.1);
				--primary-faint: rgba(147, 187, 234, 0.045);
				--secondary-subtle: rgba(146, 30, 28, 0.2);
				--accent-subtle: rgba(214, 179, 41, 0.1);
				--grid-line: rgba(67, 102, 168, 0.04);
				--answer-text: #c5d3e1;
				--error-text: #fca5a5;
				--error-border: rgba(252, 165, 165, 0.35);
				--shadow-color: rgba(0, 0, 0, 0.16);
			}
			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-height: 100vh;
				background: var(--bg);
				color: var(--text);
				font-family:
					-apple-system, BlinkMacSystemFont, "Segoe UI", Urbanist,
					sans-serif;
				line-height: 1.6;
			}


			body::before {
			  content: '';
			  position: fixed;
			  inset: 0;
			  background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
			  background-size: 48px 48px;
			  pointer-events: none;
			  z-index: 0;
			}
			button {
				font: inherit;
			}
			.page-shell {
				width: min(100%, 1440px);
				margin: 0 auto;
				padding: 28px 16px 48px;
			}
			.topbar {
				display: flex;
				align-items: center;
				gap: 16px;
				margin-bottom: 30px;
			}
			.back-link,
			.icon-button {
				display: inline-grid;
				place-items: center;
				width: 42px;
				height: 42px;
				border: 1px solid var(--line);
				border-radius: 12px;
				color: var(--text);
				background: var(--primary-faint);
				text-decoration: none;
				cursor: pointer;
				transition: 0.2s ease;
			}
			.back-link:hover,
			.icon-button:hover {
				color: var(--primary);
				border-color: var(--primary);
				transform: translateY(-2px);
			}
			.heading {
				flex: 1;
			}
			.eyebrow {
				margin: 0 0 4px;
				color: var(--accent);
				font-size: 0.75rem;
				font-weight: 800;
				letter-spacing: 0.14em;
				text-transform: uppercase;
			}
			h1,
			h2,
			h3,
			p {
				margin-top: 0;
			}
			h1 {
				margin-bottom: 4px;
				font-size: clamp(1.7rem, 4vw, 2.5rem);
				line-height: 1.15;
			}
			.subtitle {
				margin: 0;
				color: var(--muted);
			}
			.source-pill {
				border: 1px solid var(--line);
				border-radius: 999px;
				padding: 8px 13px;
				color: var(--text-muted);
				font-size: 0.8rem;
				white-space: nowrap;
				font-family: 'JetBrains Mono', monospace;
			}
			.workspace {
				--list-width: 50%;
				display: flex;
				align-items: stretch;
				gap: 20px;
				min-height: calc(100vh - 150px);
			}
			.list-pane {
				min-width: 0;
				width: 100%;
				transition: width 0.3s ease;
			}
			.workspace.has-selection .list-pane {
				flex: 0 0 var(--list-width);
				width: var(--list-width);
			}
			.resize-handle {
				display: none;
				flex: 0 0 12px;
				align-items: center;
				justify-content: center;
				margin: 0 -6px;
				border: 0;
				color: var(--muted);
				background: transparent;
				cursor: col-resize;
				touch-action: none;
				user-select: none;
			}
			.workspace.has-selection .resize-handle {
				display: flex;
			}
			.resize-handle::before {
				content: "";
				width: 3px;
				height: 52px;
				border-radius: 999px;
				background: var(--line);
				transition: background 0.2s ease, height 0.2s ease;
			}
			.resize-handle:hover::before,
			.resize-handle.is-dragging::before {
				height: 76px;
				background: var(--primary);
			}
			.list-header {
				display: flex;
				align-items: end;
				justify-content: space-between;
				gap: 16px;
				margin-bottom: 16px;
			}
			.list-header h2 {
				margin-bottom: 0;
				font-size: 1.15rem;
			}
			.list-count {
				color: var(--muted);
				font-size: 0.88rem;
			}
			.categories {
				display: grid;
				gap: 13px;
			}
			.category {
				overflow: hidden;
				border: 1px solid var(--line);
				border-radius: 16px;
				background: var(--surface);
			}
			.category-toggle {
				display: flex;
				align-items: center;
				width: 100%;
				padding: 17px 18px;
				border: 0;
				color: var(--text);
				background: transparent;
				text-align: left;
				cursor: pointer;
			}
			.category-toggle:hover {
				background: var(--primary-faint);
			}
			.category-name {
				flex: 1;
				font-size: 1rem;
				font-weight: 700;
			}
			.count-badge {
				margin-right: 12px;
				padding: 3px 9px;
				border-radius: 999px;
				color: var(--primary);
				background: var(--primary-subtle);
				font-size: 0.76rem;
			}
			.chevron {
				color: var(--primary);
				transition: transform 0.25s ease;
			}
			.category.is-collapsed .chevron {
				transform: rotate(-90deg);
			}
			.category-items {
				display: grid;
				gap: 10px;
				padding: 0 12px 12px;
			}
			.category.is-collapsed .category-items {
				display: none;
			}
			.question-card {
				display: block;
				width: 100%;
				padding: 16px;
				border: 1px solid var(--line);
				border-radius: 12px;
				color: var(--text);
				background: var(--primary-faint);
				text-align: left;
				cursor: pointer;
				transition: 0.2s ease;
			}
			.question-card:hover {
				border-color: var(--primary);
				background: var(--primary-subtle);
				box-shadow: 0 8px 18px var(--shadow-color);
				transform: translateY(-1px);
			}
			.question-card.is-selected {
				border-color: var(--accent);
				background: var(--accent-subtle);
				box-shadow: inset 3px 0 var(--accent);
			}
			.question-card p {
				margin-bottom: 9px;
				font-weight: 600;
			}
			.question-card-text {
				margin-bottom: 9px;
				font-weight: 600;
			}
			.question-preview {
				display: block;
				overflow: hidden;
				color: var(--muted);
				font-size: 0.84rem;
				text-overflow: ellipsis;
				white-space: nowrap;
			}
			.question-meta {
				display: flex;
				flex-wrap: wrap;
				gap: 7px;
				margin-top: 10px;
				color: var(--primary);
				font-size: 0.75rem;
			}
			.meta-tag {
				padding: 3px 8px;
				border-radius: 5px;
				background: var(--primary-subtle);
			}
			.tree-children {
				display: grid;
				gap: 10px;
				padding: 0 12px 12px 24px;
			}
			.tree-children .category {
				background: var(--primary-faint);
				border-radius: 12px;
			}
			.tree-children .category-toggle {
				padding: 14px 16px;
			}
			.tree-children .category-name {
				font-size: 0.94rem;
			}
			.detail-pane {
				height: min-content;
				max-height: 94vh;
				position: sticky;
				top: 20px;
				width: 0;
				min-width: 0;
				overflow: hidden;
				overflow-y: scroll;
				opacity: 0;
				transform: translateX(20px);
				border: 1px solid var(--line);
				border-radius: 18px;
				background: var(--surface);
				transition:
					width 0.3s ease,
					opacity 0.25s ease,
					transform 0.3s ease;
			}
			.workspace.has-selection .detail-pane {
				flex: 1 1 auto;
				width: auto;
				opacity: 1;
				transform: translateX(0);
			}
			.detail-scroll {
				/*height: calc(100vh - 150px);*/
				height: 100%;
				overflow-y: auto;
				padding: 24px;
			}
			.detail-top {
				display: flex;
				justify-content: space-between;
				gap: 12px;
				margin-bottom: 30px;
			}
			.detail-label {
				color: var(--accent);
				font-size: 0.76rem;
				font-weight: 800;
				letter-spacing: 0.1em;
				text-transform: uppercase;
			}
			.detail-pane h2 {
				margin: 8px 0 24px;
				font-size: clamp(1.2rem, 1.5vw, 2.15rem);
				line-height: 1.25;
			}
			.detail-source {
				display: inline-flex;
				align-items: center;
				gap: 7px;
				margin: -10px 0 24px;
				padding: 5px 10px;
				border: 1px solid var(--line);
				border-radius: 999px;
				color: var(--primary);
				background: var(--primary-subtle);
				font-size: 0.78rem;
			}
			.detail-source i {
				font-size: 0.72rem;
			}
			.answer {
				color: var(--answer-text);
				font-size: 1rem;
			}
			.answer p {
				margin-bottom: 1em;
				white-space: pre-wrap;
			}
			.provider {
				display: flex;
				align-items: center;
				gap: 10px;
				margin-top: 28px;
				padding-top: 18px;
				border-top: 1px solid var(--line);
				color: var(--muted);
				font-size: 0.86rem;
			}
			.provider i {
				color: var(--primary);
			}
			.empty,
			.error {
				padding: 45px 20px;
				border: 1px dashed var(--line);
				border-radius: 16px;
				color: var(--muted);
				text-align: center;
			}
			.error {
				color: var(--error-text);
				border-color: var(--error-border);
			}
			.mobile-back {
				display: none;
			}
			@media (max-width: 767px) {
				.page-shell {
					padding: 18px 12px 32px;
				}
				.topbar {
					margin-bottom: 22px;
				}
				.source-pill {
					display: none;
				}
				.workspace {
					min-height: 0;
				}
				.workspace.has-selection .list-pane {
					display: none;
				}
				.workspace.has-selection .detail-pane {
					width: 100%;
				}
				.resize-handle {
					display: none !important;
				}
				.detail-scroll {
					height: 100%;
					min-height: calc(100vh - 105px);
					padding: 20px;
				}
				.mobile-back {
					display: inline-flex;
					align-items: center;
					gap: 8px;
					margin-bottom: 22px;
					padding: 0;
					border: 0;
					color: var(--primary);
					background: transparent;
					cursor: pointer;
				}
			}
		</style>
	</head>
	<body>
		<main class="page-shell">
			<header class="topbar">
				<a class="back-link" href="./" aria-label="Back to resources"
					><i class="fa-solid fa-arrow-left"></i
				></a>
				<div class="heading">
					<p class="eyebrow"></p>
					<h1 id="pageTitle">Question Bank</h1>
					<p class="subtitle" id="pageSubtitle">
						Browse questions by category
					</p>
				</div>
				<span class="source-pill" id="sourcePill">Loading...</span>
			</header>
			<section class="workspace" id="workspace" aria-live="polite">
				<div class="list-pane">
					<div class="list-header">
						<h2>Question list</h2>
						<span class="list-count" id="listCount"></span>
					</div>
					<div class="categories" id="categories">
						<div class="empty">Loading question bank...</div>
					</div>
				</div>
				<button
					class="resize-handle"
					id="resizeHandle"
					type="button"
					aria-label="Resize question list and detail panel"
					title="Drag to resize"
				></button>
				<aside
					class="detail-pane"
					id="detailPane"
					aria-label="Question details"
				>
					<div class="detail-scroll">
						<button
							class="mobile-back"
							id="mobileBack"
							type="button"
						>
							<i class="fa-solid fa-arrow-left"></i> Back to list
						</button>
						<div class="detail-top">
							<span class="detail-label">Selected question</span
							><button
								class="icon-button"
								id="closeDetail"
								type="button"
								aria-label="Close detail"
							>
								<i class="fa-solid fa-xmark"></i>
							</button>
						</div>
						<div id="detailContent"></div>
					</div>
				</aside>
			</section>
		</main>
		<script>
			const params = new URLSearchParams(window.location.search),
				dataUrls = [
					...params.getAll("url"),
					...params.getAll("file"),
					...params.getAll("src"),
					...params.getAll("topic"),
				]
					.filter(
						(url, index, urls) =>
							url.trim() && urls.indexOf(url) === index,
					)
					.map((url) => {
						const trimmedUrl = url.trim() + ".json";
						if (/^(?:[a-z][a-z\d+\-.]*:)?\/\//i.test(trimmedUrl))
							return trimmedUrl;
						const relativePath = trimmedUrl.replace(/^\/+/, "");
						return relativePath.startsWith("question-bank/")
							? relativePath
							: `question-bank/${relativePath}`;
					}),
				state = {
					questions: [],
					selectedQuestionId: null,
					listWidth: 50,
				};
			const splitterStorageKey = "questionBankListWidth";
			try {
				const savedWidth = Number(
					localStorage.getItem(splitterStorageKey),
				);
				if (Number.isFinite(savedWidth))
					state.listWidth = Math.min(75, Math.max(25, savedWidth));
			} catch (error) {
				console.warn("Could not restore question bank panel width.", error);
			}
			const $ = (id) => document.getElementById(id),
				escapeHtml = (value) =>
					String(value ?? "")
						.replace(/&/g, "&amp;")
						.replace(/</g, "&lt;")
						.replace(/>/g, "&gt;")
						.replace(/"/g, "&quot;")
						.replace(/'/g, "&#039;");
			function formatAnswer(value) {
				const container = document.createElement("div");
				const normalized = String(value ?? "Answer not available yet")
					.replace(/\\n/g, "\n")
					.replace(/\r\n?/g, "\n")
					.replace(/\n/g, "<br>");
				container.innerHTML = normalized;
				const allowedTags = new Set([
					"A",
					"B",
					"BLOCKQUOTE",
					"BR",
					"CODE",
					"DEL",
					"EM",
					"I",
					"LI",
					"OL",
					"P",
					"PRE",
					"S",
					"STRONG",
					"SUB",
					"SUP",
					"SPAN",
					"U",
					"UL",
				]);
				container.querySelectorAll("*").forEach((element) => {
					if (!allowedTags.has(element.tagName)) {
						element.replaceWith(...element.childNodes);
						return;
					}
					[...element.attributes].forEach((attribute) => {
						const attributeName = attribute.name.toLowerCase();
						const isEventAttribute = attributeName.startsWith("on");
						const isUnsafeValue =
							/url\s*\(|expression\s*\(|javascript:|vbscript:|data:/i.test(
								attribute.value,
							);
						const isAllowedAttribute =
							attributeName === "class" ||
							attributeName === "title" ||
							attributeName === "style" ||
							(attributeName === "href" &&
								/^(?:https?:|mailto:|#)/i.test(
									attribute.value.trim(),
								));
						if (
							isEventAttribute ||
							isUnsafeValue ||
							!isAllowedAttribute
						)
							element.removeAttribute(attribute.name);
					});
				});
				return container.innerHTML;
			}
			function displayName(url) {
				const file = decodeURIComponent(
					url.split("/").pop() || "Question Bank",
				).replace(/\.json$/i, "");
				return file
					.replace(/[-_]/g, " ")
					.replace(/\b\w/g, (letter) => letter.toUpperCase());
			}
			function normalizeQuestions(payload) {
				if (!payload || typeof payload !== "object")
					throw new Error(
						"The file does not contain a question bank.",
					);
				const isQuestion = (value) =>
					value &&
					typeof value === "object" &&
					!Array.isArray(value) &&
					("question" in value || "prompt" in value);
				function buildNode(name, value, path) {
					if (Array.isArray(value))
						return {
							name,
							questions: value.filter(isQuestion),
							children: [],
							path,
						};
					if (
						!value ||
						typeof value !== "object" ||
						isQuestion(value)
					)
						return null;
					const node = { name, questions: [], children: [], path };
					Object.entries(value).forEach(([childName, childValue]) => {
						if (isQuestion(childValue))
							node.questions.push(childValue);
						else {
							const child = buildNode(childName, childValue, [
								...path,
								childName,
							]);
							if (
								child &&
								(child.questions.length ||
									child.children.length)
							)
								node.children.push(child);
						}
					});
					return node.questions.length || node.children.length
						? node
						: null;
				}
				const roots = Array.isArray(payload)
					? [buildNode("Questions", payload, ["Questions"])]
					: Object.entries(payload)
							.map(([name, value]) =>
								buildNode(name, value, [name]),
							)
							.filter(Boolean);
				if (!roots.length)
					throw new Error(
						"The file does not contain any question entries.",
					);
				return roots;
			}
			function selectQuestion(id) {
				const selected = state.questions.find(
					(question) => question.id === id,
				);
				if (!selected) return;
				const questionText = selected.question || selected.prompt;
				state.selectedQuestionId = id;
				$("workspace").classList.add("has-selection");
				document
					.querySelectorAll(".question-card")
					.forEach((card) =>
						card.classList.toggle(
							"is-selected",
							card.dataset.id === id,
						),
					);
				$("detailContent").innerHTML =
					`<h2>${formatAnswer(questionText || "Untitled question")}</h2>${selected.source && String(selected.source).trim() ? `<div class="detail-source"><i class="fa-solid fa-book-open"></i><span>Source: ${escapeHtml(String(selected.source).trim())}</span></div>` : ""}<div class="answer">${formatAnswer(
						selected.answer,
					)}</div>${selected.provider && selected.provider.trim() ? `<div class="provider"><i class="fa-solid fa-user"></i><span>Provider: ${escapeHtml(selected.provider.trim())}</span></div>` : ""}`;
				$("detailPane").querySelector(".detail-scroll").scrollTop = 0;
			}
			function render() {
				const roots = state.questions.flatMap((payload) =>
						normalizeQuestions(payload),
					),
					allQuestions = [];
				function countQuestions(node) {
					return (
						node.questions.length +
						node.children.reduce(
							(total, child) => total + countQuestions(child),
							0,
						)
					);
				}
				function questionMarkup(question, id) {
					return `<button class="question-card" type="button" data-id="${escapeHtml(id)}"><div class="question-card-text">${formatAnswer(question.question || question.prompt || "Untitled question")}</div>${question.provider || question.source ? `<span class="question-meta"><span class="meta-tag"><i class="fa-solid fa-book-open"></i> ${escapeHtml(question.provider || question.source)}</span></span>` : ""}</button>`;
				}
				function nodeMarkup(node) {
					const nodeId = node.path.join("-");
					const questions = node.questions
						.map((question, index) => {
							const id = `${nodeId}-${index}`;
							allQuestions.push({
								...question,
								category: node.name,
								id,
							});
							return questionMarkup(question, id);
						})
						.join("");
					const children = node.children
						.map((child) => nodeMarkup(child))
						.join("");
					return `<section class="category"><button class="category-toggle" type="button" aria-expanded="true"><span class="category-name">${escapeHtml(node.name)}</span><span class="count-badge">${countQuestions(node)}</span><i class="chevron fa-solid fa-chevron-down"></i></button><div class="category-items">${questions}${children ? `<div class="tree-children">${children}</div>` : ""}</div></section>`;
				}
				$("categories").innerHTML =
					roots.map(nodeMarkup).join("") ||
					'<div class="empty">No questions were found in this file.</div>';
				state.questions = allQuestions;
				$("listCount").textContent =
					`${state.questions.length} question${state.questions.length === 1 ? "" : "s"}`;
				document
					.querySelectorAll(".category-toggle")
					.forEach((button) =>
						button.addEventListener("click", () => {
							const category = button.closest(".category"),
								collapsed =
									category.classList.toggle("is-collapsed");
							button.setAttribute(
								"aria-expanded",
								String(!collapsed),
							);
						}),
					);
				document
					.querySelectorAll(".question-card")
					.forEach((card) =>
						card.addEventListener("click", () =>
							selectQuestion(card.dataset.id),
						),
					);
			}
			function closeDetail() {
				state.selectedQuestionId = null;
				$("workspace").classList.remove("has-selection");
				document
					.querySelectorAll(".question-card")
					.forEach((card) => card.classList.remove("is-selected"));
			}
			function setListWidth(width) {
				state.listWidth = Math.min(75, Math.max(25, width));
				$("workspace").style.setProperty(
					"--list-width",
					`${state.listWidth}%`,
				);
				try {
					localStorage.setItem(
						splitterStorageKey,
						String(state.listWidth),
					);
				} catch (error) {
					console.warn("Could not save question bank panel width.", error);
				}
			}
			function startResize(event) {
				if (!window.matchMedia("(min-width: 768px)").matches) return;
				event.preventDefault();
				const handle = $("resizeHandle");
				const workspace = $("workspace");
				const workspaceRect = workspace.getBoundingClientRect();
				const availableWidth = workspaceRect.width - 20;
				handle.classList.add("is-dragging");
				const move = (moveEvent) => {
					const pointerX = moveEvent.clientX - workspaceRect.left;
					setListWidth((pointerX / availableWidth) * 100);
				};
				const stop = () => {
					handle.classList.remove("is-dragging");
					window.removeEventListener("pointermove", move);
					window.removeEventListener("pointerup", stop);
				};
				window.addEventListener("pointermove", move);
				window.addEventListener("pointerup", stop, { once: true });
			}
			$("closeDetail").addEventListener("click", closeDetail);
			$("mobileBack").addEventListener("click", closeDetail);
			$("resizeHandle").addEventListener("pointerdown", startResize);
			$("workspace").style.setProperty(
				"--list-width",
				`${state.listWidth}%`,
			);
			if (!dataUrls.length) {
				$("pageSubtitle").textContent = "No question files supplied";
				$("sourcePill").textContent = "Add ?url=...";
				$("categories").innerHTML =
					'<div class="error"><i class="fa-solid fa-link-slash"></i><br>No question file was supplied.<br><small>Use one or more <code>?url=...</code> parameters.</small></div>';
			} else {
				$("pageSubtitle").textContent =
					dataUrls.length === 1
						? displayName(dataUrls[0])
						: `${dataUrls.length} question files`;
			}
			$("sourcePill").textContent = "shs-pyqp-project";
			if (dataUrls.length) {
				Promise.all(
					dataUrls.map((dataUrl) =>
						fetch(dataUrl).then((response) => {
							if (!response.ok)
								throw new Error(
									`Could not load ${dataUrl} (${response.status}).`,
								);
							return response.json();
						}),
					),
				)
					.then((payloads) => {
						state.questions = payloads;
						render();
					})
					.catch((error) => {
						$("categories").innerHTML =
							`<div class="error"><i class="fa-solid fa-triangle-exclamation"></i><br>${escapeHtml(error.message)}<br><small>Pass one or more JSON files with <code>?url=...</code>.</small></div>`;
						$("sourcePill").textContent = "Unable to load";
					});
			}
		</script>
	</body>
</html>
