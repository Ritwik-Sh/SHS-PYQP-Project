<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Print Version</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --bg: #fdfcfa;
            --text: #1a1614;
            --text-secondary: #6b6561;
            --accent: #d97706;
            --border: #e7e5e4;
            --code-bg: #faf8f6;
            --answer-bg: #fef3c7;
        }

        @page {
            size: A4;
            margin: 1.5cm;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Crimson Text', Georgia, serif;
            font-size: 11pt;
            line-height: 1.6;
            color: var(--text);
            background: var(--bg);
        }

        .header {
            border-bottom: 2px solid var(--text);
            padding-bottom: 0.75rem;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 24pt;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .header .meta {
            display: flex;
            justify-content: space-between;
            font-size: 9pt;
            color: var(--text-secondary);
            font-style: italic;
        }

        .section-header {
            margin-top: 2.5rem;
            margin-bottom: 1.5rem;
        }

        .section-header h2 {
            font-size: 16pt;
            font-weight: 600;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        .question {
            margin-bottom: 1.75rem;
            page-break-inside: avoid;
        }

        .question-number {
            font-size: 9pt;
            color: var(--text-secondary);
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .question-text {
            font-size: 11pt;
            margin-bottom: 0.75rem;
        }

        .question-text pre {
            background: var(--code-bg);
            border-left: 3px solid var(--accent);
            padding: 0.75rem;
            margin: 0.75rem 0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9pt;
            overflow-x: auto;
        }

        .question-text code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 9.5pt;
            background: var(--code-bg);
            padding: 0.1rem 0.3rem;
        }

        .options {
            margin-left: 1rem;
            margin-top: 0.5rem;
        }

        .option {
            margin-bottom: 0.4rem;
            display: flex;
        }

        .option-label {
            font-weight: 600;
            margin-right: 0.5rem;
            min-width: 1.5rem;
            color: var(--text-secondary);
        }

        .fib-answer-space {
            display: inline-block;
            min-width: 8rem;
            border-bottom: 1px solid var(--text);
            margin: 0 0.5rem;
            height: 1.2em;
        }

        .answer-key {
            margin-top: 3rem;
            page-break-before: always;
        }

        .answer-key h2 {
            font-size: 18pt;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--text);
            padding-bottom: 0.5rem;
        }

        .answer-item {
            margin-bottom: 1.25rem;
            padding: 0.75rem;
            background: var(--answer-bg);
            border-radius: 4px;
            page-break-inside: avoid;
        }

        .answer-number {
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.25rem;
        }

        .answer-text {
            font-size: 10pt;
        }

        .explanation {
            font-size: 9.5pt;
            color: var(--text-secondary);
            font-style: italic;
            margin-top: 0.25rem;
        }

        .passage-container {
            background: var(--code-bg);
            border-left: 3px solid var(--accent);
            padding: 0.75rem;
            margin: 0.75rem 0;
            line-height: 1.8;
            font-size: 10.5pt;
        }

        .passage-blank {
            display: inline-block;
            min-width: 4rem;
            border-bottom: 1px solid var(--text);
            margin: 0 0.25rem;
        }

        @media print {
            body {
                background: white;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 id="quiz-title">Quiz</h1>
            <div class="meta">
                <span id="quiz-date"></span>
                <span id="quiz-total"></span>
            </div>
        </div>

        <div class="section-header">
            <h2>Questions</h2>
        </div>
        <div id="questions-container"></div>

        <div class="answer-key">
            <h2>Answer Key</h2>
            <div id="answers-container"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const topic = urlParams.get('topic') || urlParams.get('quiz');

        if (!topic) {
            document.body.innerHTML = '<div class="header"><h1>Error: No topic specified</h1><p>Please provide a topic parameter in the URL (e.g., ?topic=java-basics)</p></div>';
        } else {
            loadQuiz(topic);
        }

        function formatCode(text) {
            if (!text) return '';
            return text.replace(/```java\n([\s\S]*?)\n```/g, '<pre><code>$1</code></pre>')
                .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/`([^`]+)`/g, '<code>$1</code>');
        }

        async function loadQuiz(topic) {
            try {
                const res = await fetch(`/public/resources/${topic}.json`);
                if (!res.ok) {
                    throw new Error(`Failed to load ${topic}.json`);
                    return;
                }
                const questions = await res.json();

                const title = topic.replace(/-/g, ' ')
                    .split(' ')
                    .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                    .join(' ') + ' Quiz';

                document.getElementById('quiz-title').textContent = title;
                document.getElementById('quiz-date').textContent = new Date().toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });
                document.getElementById('quiz-total').textContent = `Total Questions: ${questions.length}`;
                document.title = title;

                const qCont = document.getElementById('questions-container');
                const aCont = document.getElementById('answers-container');

                questions.forEach((q, i) => {
                    // Render question
                    const qDiv = document.createElement('div');
                    qDiv.className = 'question';

                    let questionHTML = `
                        <div class="question-number">Question ${i + 1}</div>
                        <div class="question-text">${formatCode(q.question)}</div>
                    `;

                    if (q.type === 'fib') {
                        questionHTML += '<div><strong>Answer:</strong> <span class="fib-answer-space"></span></div>';
                    } else if (q.type === 'passageFib') {
                        let blankCounter = 0;
                        let passage = q.passage.replace(/________/g, () => {
                            return `(${blankCounter++}) <span class="passage-blank">________</span>`;
                        });
                        questionHTML += `<div class="passage-container">${passage}</div>`;
                    } else {
                        let opts = '<div class="options">';
                        q.options.forEach((o, j) => {
                            opts += `<div class="option"><span class="option-label">${String.fromCharCode(65 + j)}.</span><span>${formatCode(o)}</span></div>`;
                        });
                        opts += '</div>';
                        questionHTML += opts;
                    }

                    qDiv.innerHTML = questionHTML;
                    qCont.appendChild(qDiv);

                    // Render answer
                    const aDiv = document.createElement('div');
                    aDiv.className = 'answer-item';

                    let answerText = '';
                    if (q.type === 'fib') {
                        const answer = Array.isArray(q.answer) ? q.answer.join(' or ') : q.answer;
                        answerText = `<strong>Answer:</strong> ${answer}`;
                    } else if (q.type === 'passageFib') {
                        const answers = Object.keys(q.answer)
                            .sort((a, b) => parseInt(a) - parseInt(b))
                            .map(k => {
                                const ans = Array.isArray(q.answer[k]) ? q.answer[k].join(' or ') : q.answer[k];
                                return `(${k}) ${ans}`;
                            })
                            .join(', ');
                        answerText = `<strong>Answers:</strong> ${answers}`;
                    } else {
                        const optionLetter = String.fromCharCode(65 + q.answer);
                        answerText = `<strong>Answer:</strong> ${optionLetter}. ${formatCode(q.options[q.answer])}`;
                    }

                    let answerHTML = `
                        <div class="answer-number">Question ${i + 1}</div>
                        <div class="answer-text">${answerText}</div>
                    `;

                    if (q.explanation) {
                        answerHTML += `<div class="explanation">${formatCode(q.explanation)}</div>`;
                    }

                    aDiv.innerHTML = answerHTML;
                    aCont.appendChild(aDiv);
                });

                // Trigger print dialog after a brief delay
                setTimeout(() => {
                    window.print();
                }, 500);

            } catch (error) {
                document.body.innerHTML = `
                    <div class="header">
                        <h1>Error Loading Quiz</h1>
                        <p style="color: var(--text-secondary); margin-top: 1rem;">
                            Could not load quiz file: ${topic}.json
                        </p>
                        <p style="color: var(--text-secondary); margin-top: 0.5rem;">
                            ${error.message}
                        </p>
                    </div>
                `;
                console.log(error);
            }
        }
    </script>
</body>

</html>
