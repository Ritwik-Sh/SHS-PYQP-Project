<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHS-PYQP-Project Quizzes</title>
    <link rel="icon" type="image/png" href="../logo.png" />
    <style>
        :root {
            --bg: #040b15;
            --bg-secondary: #0c1420;
            --primary: #93bbea;
            --secondary: #921e1c;
            --accent: #d6b329;
            --text: #e5f0fa;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .header a#back-btn {
            font-size: 1.5rem;
            color: var(--text);
            text-decoration: none;
        }
        
        .header h1 {
            align-self: start;
            font-size: 1.5rem;
            font-weight: 500;
            color: var(--text);
            margin-right: auto;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        @media (max-width: 540px) {
            .header-actions .btn-label {
                display: none;
            }

            .header-actions button {
                padding: 12px 14px;
            }
        }

        /* Stats Bar */
        .stats-bar {
            display: flex;
            gap: 24px;
            padding: 20px 0;
            border-bottom: 1px solid rgba(147, 187, 234, 0.1);
            margin-bottom: 40px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: rgba(229, 240, 250, 0.5);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: 300;
            color: var(--text);
        }

        /* Progress Bar */
        .progress-container {
            height: 2px;
            background: var(--bg-secondary);
            margin-bottom: 40px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* Quiz Card */
        .quiz-card {
            background: transparent;
        }

        .question-number {
            font-size: 0.875rem;
            color: rgba(229, 240, 250, 0.4);
            margin-bottom: 24px;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 400;
            margin-bottom: 32px;
            color: var(--text);
        }

        .question-text img {
            max-width: 100%;
            height: auto;
            margin: 16px 0;
            border-radius: 8px;
            display: block;
            min-height: 400px;
        }

        .question-text pre {
            background: var(--bg-secondary) !important;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 16px 0;
            font-size: 0.9rem;
            border-left: 2px solid var(--primary);
        }

        .question-text code {
            color: var(--primary);
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
        }

        /* Options */
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 32px;
        }

        .option {
            padding: 16px 20px;
            background: var(--bg-secondary);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.95rem;
            position: relative;
            padding-left: 60px;
        }

        .option:hover:not(.disabled) {
            border-color: var(--primary);
        }

        .option.selected {
            border-color: var(--primary);
            background: rgba(147, 187, 234, 0.05);
        }

        .option.correct {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.05);
        }

        .option.incorrect {
            border-color: var(--secondary);
            background: rgba(146, 30, 28, 0.05);
        }

        .option.disabled {
            cursor: default;
            opacity: 0.6;
        }

        /* Circle */
        .option::before {
            content: attr(data-index);
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text);
            border: 1px solid rgba(147, 187, 234, 0.3);
        }

        .option[data-index="0"]::before { content: "A"; }
        .option[data-index="1"]::before { content: "B"; }
        .option[data-index="2"]::before { content: "C"; }
        .option[data-index="3"]::before { content: "D"; }

        .option.selected::before {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }

        .option.correct::before {
            background: #4ade80;
            color: #052e16;
            border-color: #4ade80;
        }

        .option.incorrect::before {
            background: var(--secondary);
            color: #fff;
            border-color: var(--secondary);
        }

        /* Fill-in-the-Blank Styles */
        .fib-container {
            margin-bottom: 32px;
        }

        .fib-input {
            width: 100%;
            padding: 16px 20px;
            background: var(--bg-secondary);
            border: 1px solid rgba(147, 187, 234, 0.2);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            transition: all 0.2s ease;
        }

        .fib-input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(147, 187, 234, 0.05);
        }

        .fib-input:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .fib-input.correct {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.05);
        }

        .fib-input.incorrect {
            border-color: var(--secondary);
            background: rgba(146, 30, 28, 0.05);
        }

        .fib-answer-display {
            margin-top: 12px;
            padding: 12px 16px;
            background: rgba(74, 222, 128, 0.05);
            border: 1px solid #4ade80;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .fib-answer-display.show {
            display: block;
        }

        .fib-answer-label {
            color: #4ade80;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .inline-code {
            background: rgba(147, 187, 234, 0.12);
            color: var(--primary);
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            font-size: 0.88em;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(147, 187, 234, 0.2);
        }

        /* Passage FIB */
        .passage-container {
            background: var(--bg-secondary);
            border: 1px solid rgba(147, 187, 234, 0.1);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
            line-height: 2;
            font-size: 1rem;
        }

        .passage-blank-display {
            display: inline-block;
            min-width: 80px;
            padding: 2px 8px;
            background: var(--bg);
            border: 1px solid rgba(147, 187, 234, 0.3);
            border-radius: 4px;
            margin: 0 2px;
            font-size: 0.9rem;
            color: rgba(229, 240, 250, 0.5);
            text-align: center;
            white-space: nowrap;
        }
        
        .passage-blank-display.example {
            color: var(--text);
            background: rgba(147, 187, 234, 0.1);
            border-color: var(--primary);
            font-weight: 500;
        }

        .passage-inputs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .passage-input-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
        }

        .passage-input-label {
            font-size: 0.75rem;
            color: rgba(229, 240, 250, 0.5);
            position: absolute;
            top: 12px;
            left: 16px;
            z-index: 1;
            pointer-events: none;
        }

        .passage-blank {
            width: 100%;
            padding: 12px 16px 12px 48px;
            background: var(--bg-secondary);
            border: 1px solid rgba(147, 187, 234, 0.3);
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--text);
            transition: all 0.2s ease;
        }

        .passage-blank:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(147, 187, 234, 0.05);
        }

        .passage-blank.correct {
            border-color: #4ade80;
            background: rgba(74, 222, 128, 0.05);
        }

        .passage-blank.incorrect {
            border-color: var(--secondary);
            background: rgba(146, 30, 28, 0.05);
        }

        .passage-blank:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .passage-blank-answer {
            display: none;
            font-size: 0.85rem;
            color: #4ade80;
            margin-top: 4px;
        }

        .passage-blank-answer.show {
            display: block;
        }

        .passage-blank-answer-label {
            color: rgba(229, 240, 250, 0.5);
        }

        /* Explanation */
        .explanation {
            padding: 20px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 32px;
            display: none;
            border-left: 2px solid var(--accent);
        }

        .explanation.show {
            display: block;
        }

        .explanation-title {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .keyboard-hint {
            font-size: 0.75rem;
            color: rgba(229, 240, 250, 0.4);
            text-align: center;
            margin-top: 16px;
            padding: 12px;
            background: rgba(147, 187, 234, 0.02);
            border-radius: 8px;
        }

        .keyboard-hint kbd {
            background: var(--bg-secondary);
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(147, 187, 234, 0.2);
            font-family: inherit;
            font-size: 0.7rem;
            margin: 0 2px;
        }

        button {
            align-items: center;
            display: flex;
            gap: 10px;
            padding: 12px 24px;
            border: 1px solid rgba(147, 187, 234, 0.2);
            border-radius: 8px;
            background: transparent;
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            font-weight: 400;
        }

        button:hover:not(:disabled) {
            border-color: var(--primary);
            background: rgba(147, 187, 234, 0.05);
        }

        button.btn-primary, button#submitBtn:enabled {
            background: var(--primary);
            color: var(--bg);
            border-color: var(--primary);
        }

        button.btn-primary:hover:not(:disabled) {
            background: rgba(147, 187, 234, 0.9);
        }

        button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Menu Overlay */
        .menu-overlay {
            position: fixed;
            right: 0;
            bottom: 100%;
            width: 100vw;
            height: 100vh;
            background: rgba(4, 11, 21, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            overflow-y: auto;
            transition: all 0.1s ease;
        }

        .menu-overlay.active {
            display: block;
            bottom: 0;
            transition: all 0.1s ease;
        }

        .menu-content {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
        }

        .menu-header h2 {
            font-size: 1.5rem;
            font-weight: 500;
        }

        .close-menu {
            font-size: 1.5rem;
            background: none;
            border: none;
            color: var(--text);
            cursor: pointer;
            padding: 8px;
        }

        .question-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
            gap: 12px;
        }

        .question-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-secondary);
            border: 1px solid transparent;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .question-item:hover {
            border-color: var(--primary);
        }

        .question-item.current {
            border-color: var(--primary);
            background: rgba(147, 187, 234, 0.1);
        }

        .question-item.answered {
            background: rgba(147, 187, 234, 0.05);
        }

        .question-item.correct {
            background: rgba(74, 222, 128, 0.1);
            border-color: #4ade80;
        }

        .question-item.incorrect {
            background: rgba(146, 30, 28, 0.1);
            border-color: var(--secondary);
        }

        /* Results */
        .results {
            text-align: center;
            display: none;
        }

        .results.show {
            display: block;
        }

        .results h2 {
            font-size: 2rem;
            font-weight: 400;
            margin-bottom: 16px;
        }

        .score {
            font-size: 4rem;
            font-weight: 300;
            color: var(--primary);
            margin: 32px 0;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin: 40px 0;
        }

        .result-item {
            padding: 24px;
            background: var(--bg-secondary);
            border-radius: 8px;
        }

        .icon {
            width: 20px;
            height: 20px;
            display: inline-block;
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
            }

            .stats-bar {
                flex-wrap: wrap;
                gap: 16px;
            }

            .controls {
                flex-direction: column;
            }
            
            .controls button {
                width: 100%;
            }

            .question-grid {
                grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
            }
        }

        /* Page layout: main content + search sidebar sit side by side */
        .page-layout {
            display: flex;
            min-height: 100vh;
            align-items: flex-start;
        }

        .page-layout > .container {
            flex: 1;
            min-width: 0;
        }

        /* Search Sidebar */
        .search-sidebar {
            width: 0;
            flex-shrink: 0;
            overflow: hidden;
            height: 100vh;
            position: sticky;
            top: 0;
            background: var(--bg-secondary);
            border-left: 1px solid rgba(147, 187, 234, 0.12);
            display: flex;
            flex-direction: column;
            transition: width 0.25s ease;
        }

        .search-sidebar.open {
            /* Width is set via JS (desktop) or 100% via media query (mobile) */
        }

        /* Drag-to-resize handle – sits on the left edge of the sidebar */
        .sidebar-resize-handle {
            position: absolute;
            left: 0;
            top: 0;
            width: 5px;
            height: 100%;
            cursor: col-resize;
            z-index: 1;
            background: transparent;
            transition: background 0.2s;
            flex-shrink: 0;
        }

        .sidebar-resize-handle:hover,
        .sidebar-resize-handle.active {
            background: rgba(147, 187, 234, 0.18);
        }

        /* Keep sidebar inner content from collapsing during width transition */
        .search-sidebar-header,
        .search-input-wrapper,
        .search-meta,
        .search-results {
            min-width: 380px;
        }

        /* Mobile: full-screen sidebar overlay (must come after desktop styles) */
        @media (max-width: 768px) {
            .search-sidebar {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                z-index: 1100;
                border-left: none;
                /* Slide in from right instead of width-expand */
                transform: translateX(100%);
                transition: transform 0.25s ease;
            }

            .search-sidebar.open {
                transform: translateX(0);
            }

            .search-sidebar-header,
            .search-input-wrapper,
            .search-meta,
            .search-results {
                min-width: 0;
                width: 100%;
            }

            .sidebar-resize-handle {
                display: none;
            }
        }

        .search-sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 16px 20px;
            border-bottom: 1px solid rgba(147, 187, 234, 0.1);
            flex-shrink: 0;
        }

        .search-sidebar-header > i {
            color: var(--primary);
            opacity: 0.8;
            font-size: 0.9rem;
        }

        .search-sidebar-header h3 {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text);
            flex: 1;
        }

        .search-input-wrapper {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(147, 187, 234, 0.1);
            flex-shrink: 0;
        }

        #searchInput {
            width: 100%;
            background: rgba(147, 187, 234, 0.06);
            border: 1px solid rgba(147, 187, 234, 0.2);
            border-radius: 8px;
            padding: 10px 14px;
            color: var(--text);
            font-size: 0.9rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease;
        }

        #searchInput:focus {
            border-color: var(--primary);
        }

        #searchInput::placeholder {
            color: rgba(229, 240, 250, 0.35);
        }

        .search-meta {
            padding: 8px 20px;
            font-size: 0.75rem;
            color: rgba(229, 240, 250, 0.4);
            flex-shrink: 0;
            min-height: 30px;
        }

        .search-results {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }

        .search-results::-webkit-scrollbar {
            width: 4px;
        }

        .search-results::-webkit-scrollbar-track {
            background: transparent;
        }

        .search-results::-webkit-scrollbar-thumb {
            background: rgba(147, 187, 234, 0.2);
            border-radius: 2px;
        }

        .search-results::-webkit-scrollbar-thumb:hover {
            background: rgba(147, 187, 234, 0.35);
        }

        .search-result-item {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(147, 187, 234, 0.07);
            border-left: 2px solid transparent;
            cursor: pointer;
            transition: background 0.15s ease, border-left-color 0.15s ease;
        }

        .search-result-item:hover {
            background: rgba(147, 187, 234, 0.07);
            border-left-color: var(--primary);
        }

        .search-result-qnum {
            font-size: 0.72rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        .search-result-snippet {
            font-size: 0.85rem;
            color: rgba(229, 240, 250, 0.8);
            line-height: 1.5;
            word-break: break-word;
        }

        .search-highlight {
            background: rgba(214, 179, 41, 0.25);
            color: var(--accent);
            border-radius: 2px;
            padding: 0 2px;
            font-weight: 600;
        }

        .search-no-results {
            padding: 32px 20px;
            text-align: center;
            color: rgba(229, 240, 250, 0.35);
            font-size: 0.875rem;
        }

        .search-sidebar-close {
            background: none;
            border: none;
            color: rgba(229, 240, 250, 0.5);
            cursor: pointer;
            padding: 6px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .search-sidebar-close:hover {
            color: var(--text);
            background: rgba(147, 187, 234, 0.08);
        }
    </style>

<body>
    <div class="page-layout">
        <div class="container">
        <div class="header">
            <a id="back-btn" href="../resources/"><i class="fa-solid fa-arrow-left"></i></a>
            <h1>Quiz</h1>
            <div class="header-actions">
                <button onclick="printQuiz()">
                    <i class="fa-solid fa-print"></i> <span class="btn-label">Print</span>
                </button>
                <button onclick="toggleSearchSidebar()">
                    <i class="fa-solid fa-magnifying-glass"></i> <span class="btn-label">Find</span>
                </button>
                <button onclick="toggleMenu()">
                    <i class="fa-solid fa-bars"></i> <span class="btn-label">All Questions</span>
                </button>
                <button onclick="resetProgress()"><i class="fa-solid fa-rotate-left"></i> <span class="btn-label">Reset</span></button>
            </div>
        </div>

        <div class="stats-bar">
            <div class="stat">
                <span class="stat-label">Accuracy</span>
                <span class="stat-value" id="accuracy">--%</span>
            </div>
            <div class="stat">
                <span class="stat-label">Correct</span>
                <span class="stat-value" id="correct">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">Incorrect</span>
                <span class="stat-value" id="incorrect">0</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="quiz-card" id="quizCard">
            <div class="question-number" id="questionNumber">Question 1</div>
            <div class="question-text" id="questionText"></div>
            <div class="options" id="options"></div>
            <div class="fib-container" id="fibContainer" style="display: none;">
                <input type="text" id="fibInput" class="fib-input" placeholder="Enter your answer here...">
                <div class="fib-answer-display" id="fibAnswer">
                    <div class="fib-answer-label">Correct Answer:</div>
                    <div id="fibAnswerText"></div>
                </div>
            </div>
            <div class="passage-fib-container" id="passageFibContainer" style="display: none;">
                <div class="passage-container" id="passageContent"></div>
                <div class="passage-inputs" id="passageInputs"></div>
            </div>
            <div class="explanation" id="explanation">
                <div class="explanation-title">Explanation</div>
                <div id="explanationText"></div>
            </div>
            <div class="controls">
                <button id="prevBtn" onclick="previousQuestion()"><i class="fa-solid fa-arrow-left"></i> Previous</button>
                <button id="submitBtn" onclick="submitAnswer()" disabled style="flex: 1;">Submit</button>
                <button class="" id="nextBtn" onclick="nextQuestion()">Next <i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div class="keyboard-hint" id="keyboardHint">
                <kbd><i class="fa-solid fa-arrow-left"></i></kbd> Previous • <kbd><i class="fa-solid fa-arrow-right"></i></kbd> Next • <kbd>Enter</kbd> Submit/Next
            </div>
        </div>

        <div class="results" id="results">
            <h2>Quiz Complete</h2>
            <div class="score" id="finalScore">0/100</div>
            <div class="results-grid">
                <div class="result-item">
                    <div class="stat-label">Percentage</div>
                    <div class="stat-value" id="percentage">0%</div>
                </div>
                <div class="result-item">
                    <div class="stat-label">Correct</div>
                    <div class="stat-value" id="finalCorrect">0</div>
                </div>
                <div class="result-item">
                    <div class="stat-label">Incorrect</div>
                    <div class="stat-value" id="finalIncorrect">0</div>
                </div>
            </div>
            <button class="btn-primary" onclick="restartQuiz()">Restart Quiz</button>
        </div>
        </div><!-- end .container -->

        <!-- Search Sidebar -->
        <div class="search-sidebar" id="searchSidebar">
            <div class="sidebar-resize-handle" id="sidebarResizeHandle" aria-hidden="true"></div>
            <div class="search-sidebar-header">
                <i class="fa-solid fa-magnifying-glass"></i>
                <h3>Search Questions</h3>
                <button class="search-sidebar-close" onclick="dismissSearchSidebar()" title="Close" aria-label="Close search sidebar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="search-input-wrapper">
                <input type="text" id="searchInput" placeholder="Search for keywords in questions…" autocomplete="off" oninput="runSearch()">
            </div>
            <div class="search-meta" id="searchMeta"></div>
            <div class="search-results" id="searchResults"></div>
        </div>
    </div>

    <!-- Menu Overlay -->
    <div class="menu-overlay" id="menuOverlay">
        <div class="menu-content">
            <div class="menu-header">
                <h2>All Questions</h2>
                <button class="close-menu" onclick="toggleMenu()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="question-grid" id="questionGrid"></div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/prismjs/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs/components/prism-java.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script>
        let questions = [];
        let currentQuestionIndex = 0;
        let selectedAnswer = null;
        let userAnswers = {};
        let correctCount = 0;
        let incorrectCount = 0;
        let topic = 'default';

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            // Toggle search sidebar with Ctrl+F
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                e.preventDefault();
                toggleSearchSidebar();
                return;
            }

            // Escape dismisses the search sidebar from anywhere
            if (e.key === 'Escape') {
                const sidebar = document.getElementById('searchSidebar');
                if (sidebar && sidebar.classList.contains('open')) {
                    dismissSearchSidebar();
                    return;
                }
            }

            // Don't interfere when typing in input
            if (e.target.tagName === 'INPUT') {
                // Allow Escape to dismiss search sidebar when search input is focused
                if (e.key === 'Escape' && e.target.id === 'searchInput') {
                    dismissSearchSidebar();
                    return;
                }
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const submitBtn = document.getElementById('submitBtn');
                    const nextBtn = document.getElementById('nextBtn');
                    if (!submitBtn.disabled) {
                        submitAnswer();
                    } else {
                        nextQuestion();
                    }
                }
                return;
            }

            // Prevent default for navigation keys
            if (['ArrowLeft', 'ArrowRight', 'Enter', ' ', '1', '2', '3', '4', 'a', 'b', 'c', 'd'].includes(e.key)) {
                e.preventDefault();
            }

            const question = questions[currentQuestionIndex];
            const isAnswered = userAnswers.hasOwnProperty(currentQuestionIndex);
            const isFIB = question && question.type === 'fib';

            // Navigation
            if (e.key === 'ArrowLeft') {
                previousQuestion();
            } else if (e.key === 'ArrowRight') {
                nextQuestion();
            } else if (e.key === 'Enter' || e.key === ' ') {
                const submitBtn = document.getElementById('submitBtn');
                if (!submitBtn.disabled) {
                    submitAnswer();
                } else {
                    nextQuestion();
                }
            }

            // MCQ answer selection (1-4 or A-D)
            if (!isFIB && !isAnswered) {
                let optionIndex = -1;
                if (e.key === '1' || e.key.toLowerCase() === 'a') optionIndex = 0;
                else if (e.key === '2' || e.key.toLowerCase() === 'b') optionIndex = 1;
                else if (e.key === '3' || e.key.toLowerCase() === 'c') optionIndex = 2;
                else if (e.key === '4' || e.key.toLowerCase() === 'd') optionIndex = 3;

                if (optionIndex >= 0 && optionIndex < question.options.length) {
                    selectOption(optionIndex);
                }
            }

            // Focus FIB input when starting to type
            if (isFIB && !isAnswered && e.key.length === 1 && !e.ctrlKey && !e.metaKey) {
                document.getElementById('fibInput').focus();
            }
        });

        // Load questions from JSON file
        async function loadQuestions() {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                topic = urlParams.get('quiz') || urlParams.get('topic') || 'default';
                topic = topic.replace('.json', '');
                document.title = topic + " Quiz";
                document.querySelector('.header h1').textContent = topic + " Quiz";
                const response = await fetch(topic+".json");
                questions = await response.json();
                loadProgress();
                initQuestionGrid();
                loadQuestion();
            } catch (error) {
                document.getElementById('questionText').innerHTML = 
                    '<p style="color: var(--secondary);">Error loading questions. Topic Not Found.</p>';
            }
        }

        // LocalStorage functions (supports 5-10MB vs 4KB cookie limit)
        function saveProgress() {
            const progress = {
                currentQuestionIndex,
                userAnswers,
                correctCount,
                incorrectCount
            };

            try {
                localStorage.setItem(`quizProgress_${topic}`, JSON.stringify(progress));
                console.log('Progress saved for topic:', topic);
            } catch (e) {
                console.error('Failed to save progress:', e);
                // If localStorage is full, try to clear old quiz data
                if (e.name === 'QuotaExceededError') {
                    console.warn('Storage quota exceeded, clearing old quiz data...');
                    clearOldQuizData();
                    try {
                        localStorage.setItem(`quizProgress_${topic}`, JSON.stringify(progress));
                    } catch (e2) {
                        console.error('Still failed to save after cleanup:', e2);
                    }
                }
            }
        }

        function loadProgress() {
            console.log('Loading progress for topic:', topic);
            
            try {
                const saved = localStorage.getItem(`quizProgress_${topic}`);
                if (!saved) {
                    console.log('No saved progress found');
                    return;
                }

                const progress = JSON.parse(saved);

                currentQuestionIndex = progress.currentQuestionIndex ?? 0;
                userAnswers = progress.userAnswers ?? {};
                correctCount = progress.correctCount ?? 0;
                incorrectCount = progress.incorrectCount ?? 0;

                console.log('Progress loaded:', progress);
                updateStats();
            } catch (e) {
                console.warn('Corrupt quiz data, resetting.', e);
                localStorage.removeItem(`quizProgress_${topic}`);
            }
        }

        function resetProgress() {
            if (confirm('Are you sure you want to reset all progress?')) {
                localStorage.removeItem(`quizProgress_${topic}`);
                currentQuestionIndex = 0;
                userAnswers = {};
                correctCount = 0;
                incorrectCount = 0;
                document.getElementById('results').classList.remove('show');
                document.getElementById('quizCard').style.display = 'block';
                updateStats();
                loadQuestion();
                initQuestionGrid();
            }
        }

        // Helper function to clear old quiz data if storage is full
        function clearOldQuizData() {
            const keysToRemove = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith('quizProgress_') && key !== `quizProgress_${topic}`) {
                    keysToRemove.push(key);
                }
            }
            keysToRemove.forEach(key => localStorage.removeItem(key));
            console.log('Cleared old quiz data:', keysToRemove.length, 'items');
        }

        function formatCode(text) {
            return text
                .replace(/```java\n([\s\S]*?)\n```/g,
                    '<pre><code class="language-java">$1</code></pre>')
                .replace(/```([\s\S]*?)```/g,
                    '<pre><code class="language-none">$1</code></pre>')
                .replace(/`([^`]+)`/g,
                    '<code class="inline-code">$1</code>')
                .replace("\n", "<br>")
                .replace("\t", "&emsp;");
        }

        function normalizeAnswer(answer) {
            if (!answer) return '';
            return answer.toString().trim().toLowerCase();
        }

        function loadQuestion() {
            if (questions.length === 0) return;

            const question = questions[currentQuestionIndex];
            const questionText = document.getElementById('questionText');
            const optionsDiv = document.getElementById('options');
            const fibContainer = document.getElementById('fibContainer');
            const fibInput = document.getElementById('fibInput');
            const fibAnswer = document.getElementById('fibAnswer');
            const passageFibContainer = document.getElementById('passageFibContainer');
            const passageContent = document.getElementById('passageContent');
            const explanation = document.getElementById('explanation');
            
            document.getElementById('questionNumber').textContent = `Question ${currentQuestionIndex + 1}`;
            
            questionText.innerHTML = formatCode(question.question);
            
            const isAnswered = userAnswers.hasOwnProperty(currentQuestionIndex);
            const isFIB = question.type === 'fib';
            const isPassageFib = question.type === 'passageFib';

            // Reset displays
            optionsDiv.innerHTML = '';
            fibInput.value = '';
            fibInput.className = 'fib-input';
            fibAnswer.classList.remove('show');
            
            // Update keyboard hint
            const keyboardHint = document.getElementById('keyboardHint');
            if (isFIB || isPassageFib) {
                keyboardHint.innerHTML = '<kbd><i class="fa-solid fa-arrow-left"></i></kbd> Previous • <kbd><i class="fa-solid fa-arrow-right"></i></kbd> Next • <kbd>Enter</kbd> Submit';
            } else {
                keyboardHint.innerHTML = '<kbd>1-4</kbd> or <kbd>A-D</kbd> Select • <kbd><i class="fa-solid fa-arrow-left"></i></kbd> Prev • <kbd><i class="fa-solid fa-arrow-right"></i></kbd> Next • <kbd>Enter</kbd> Submit';
            }
            
            if (isPassageFib) {
                // Passage fill-in-the-blank question
                optionsDiv.style.display = 'none';
                fibContainer.style.display = 'none';
                passageFibContainer.style.display = 'block';
                
                // Parse the passage and auto-number blanks
                const passage = question.passage;
                let passageHTML = passage;
                let blankCounter = 0;
                const blankNumbers = [];
                
                // Replace all ________ with numbered blanks
                passageHTML = passageHTML.replace(/________/g, () => {
                    const num = blankCounter;
                    blankNumbers.push(num);
                    blankCounter++;
                    
                    // For blank (0), check if there's an answer to pre-fill
                    if (num === 0 && question.answer && question.answer['0']) {
                        const exampleAnswer = Array.isArray(question.answer['0']) 
                            ? question.answer['0'][0] 
                            : question.answer['0'];
                        return `(<span style="color: rgba(229, 240, 250, 0.5);">${num}</span>) <span class="passage-blank-display example">${exampleAnswer}</span>`;
                    }
                    
                    return `(<span style="color: rgba(229, 240, 250, 0.5);">${num}</span>) <span class="passage-blank-display">________</span>`;
                });
                
                passageContent.innerHTML = passageHTML;
                
                // Create input fields below
                const passageInputs = document.getElementById('passageInputs');
                passageInputs.innerHTML = '';
                
                blankNumbers.forEach((blankNumber) => {
                    // Skip creating input for blank (0) - it's the example answer
                    if (blankNumber === 0) {
                        return;
                    }
                    
                    // Skip creating input for this blank if it's not in the answer object (it's a hint)
                    if (!question.answer.hasOwnProperty(blankNumber.toString())) {
                        return;
                    }
                    
                    const inputGroup = document.createElement('div');
                    inputGroup.className = 'passage-input-group';
                    
                    const label = document.createElement('div');
                    label.className = 'passage-input-label';
                    label.textContent = `(${blankNumber})`;
                    
                    const input = document.createElement('input');
                    input.type = 'text';
                    input.id = `passageBlank${blankNumber}`;
                    input.className = 'passage-blank';
                    input.dataset.index = blankNumber;
                    input.placeholder = '';
                    
                    const answerDiv = document.createElement('div');
                    answerDiv.className = 'passage-blank-answer';
                    answerDiv.id = `passageAnswer${blankNumber}`;
                    
                    inputGroup.appendChild(label);
                    inputGroup.appendChild(input);
                    inputGroup.appendChild(answerDiv);
                    passageInputs.appendChild(inputGroup);
                });
                
                // Restore or set up inputs
                if (isAnswered) {
                    const userAnswer = userAnswers[currentQuestionIndex];
                    const correctAnswers = question.answer;
                    
                    blankNumbers.forEach((blankNumber) => {
                        // Skip blank (0) - it's the example answer
                        if (blankNumber === 0) {
                            return;
                        }
                        
                        // Skip if this blank is not in the answer object (it's a hint)
                        if (!question.answer.hasOwnProperty(blankNumber.toString())) {
                            return;
                        }
                        
                        const input = document.getElementById(`passageBlank${blankNumber}`);
                        const answerDiv = document.getElementById(`passageAnswer${blankNumber}`);
                        const userVal = userAnswer ? userAnswer[blankNumber] : '';
                        const correctVal = correctAnswers ? correctAnswers[blankNumber] : '';
                        
                        input.value = userVal || '';
                        input.disabled = true;
                        
                        if (!correctVal) {
                            // If no correct answer defined for this blank, skip validation
                            return;
                        }
                        
                        const isCorrect = Array.isArray(correctVal)
                            ? correctVal.some(ans => normalizeAnswer(ans) === normalizeAnswer(userVal))
                            : normalizeAnswer(correctVal) === normalizeAnswer(userVal);
                        
                        input.classList.add(isCorrect ? 'correct' : 'incorrect');
                        
                        if (!isCorrect && correctVal) {
                            const displayAnswer = Array.isArray(correctVal) ? correctVal.join(' or ') : correctVal;
                            answerDiv.innerHTML = `<span class="passage-blank-answer-label">Correct: </span>${displayAnswer}`;
                            answerDiv.classList.add('show');
                        }
                    });
                } else {
                    // Set up input event listeners
                    blankNumbers.forEach((blankNumber) => {
                        // Skip blank (0) - it's the example answer
                        if (blankNumber === 0) {
                            return;
                        }
                        
                        // Skip if this blank is not in the answer object (it's a hint)
                        if (!question.answer.hasOwnProperty(blankNumber.toString())) {
                            return;
                        }
                        
                        const input = document.getElementById(`passageBlank${blankNumber}`);
                        input.oninput = () => {
                            // Check if all blanks are filled
                            const allFilled = Array.from(document.querySelectorAll('.passage-blank'))
                                .every(inp => inp.value.trim() !== '');
                            document.getElementById('submitBtn').disabled = !allFilled;
                            nextBtn.classList.remove('btn-primary');
                        };
                    });
                }
            } else if (isFIB) {
                // Fill-in-the-blank question
                optionsDiv.style.display = 'none';
                fibContainer.style.display = 'block';
                passageFibContainer.style.display = 'none';
                
                if (isAnswered) {
                    fibInput.value = userAnswers[currentQuestionIndex];
                    fibInput.disabled = true;
                    
                    const correctAnswer = Array.isArray(question.answer) ? question.answer[0] : question.answer;
                    const isCorrect = Array.isArray(question.answer) 
                        ? question.answer.some(ans => normalizeAnswer(ans) === normalizeAnswer(userAnswers[currentQuestionIndex]))
                        : normalizeAnswer(correctAnswer) === normalizeAnswer(userAnswers[currentQuestionIndex]);
                    
                    fibInput.classList.add(isCorrect ? 'correct' : 'incorrect');
                    
                    if (!isCorrect) {
                        document.getElementById('fibAnswerText').textContent = 
                            Array.isArray(question.answer) ? question.answer.join(' or ') : correctAnswer;
                        fibAnswer.classList.add('show');
                    }
                } else {
                    fibInput.disabled = false;
                    fibInput.focus(); // Auto-focus for keyboard input
                    fibInput.oninput = () => {
                        document.getElementById('submitBtn').disabled = fibInput.value.trim() === '';
                        nextBtn.classList.remove('btn-primary');
                    };
                }
            } else {
                // Multiple choice question
                fibContainer.style.display = 'none';
                passageFibContainer.style.display = 'none';
                optionsDiv.style.display = 'flex';
                
                question.options.forEach((option, index) => {
                    const optionDiv = document.createElement('div');
                    optionDiv.className = 'option';
                    optionDiv.dataset.index = index;
                    
                    if (isAnswered) {
                        optionDiv.classList.add('disabled');
                        if (index === question.answer) {
                            optionDiv.classList.add('correct');
                        }
                        if (index === userAnswers[currentQuestionIndex] && index !== question.answer) {
                            optionDiv.classList.add('incorrect');
                        }
                    }
                    
                    optionDiv.innerHTML = `${option}`;
                    
                    if (!isAnswered) {
                        optionDiv.onclick = () => selectOption(index);
                    }
                    
                    optionsDiv.appendChild(optionDiv);
                });
            }
            
            if (isAnswered) {
                // Show explanation only if it exists and is not empty
                if (question.explanation && question.explanation.trim() !== '') {
                    document.getElementById('explanationText').innerHTML = formatCode(question.explanation);
                    explanation.classList.add('show');
                } else {
                    explanation.classList.remove('show');
                }
                document.getElementById('submitBtn').disabled = true;
                nextBtn.classList.add('btn-primary');
            } else {
                explanation.classList.remove('show');
                document.getElementById('submitBtn').disabled = true;
                nextBtn.classList.remove('btn-primary');
            }
            
            document.getElementById('prevBtn').disabled = currentQuestionIndex === 0;
            
            if (currentQuestionIndex === questions.length - 1 && Object.keys(userAnswers).length === questions.length) {
                document.getElementById('nextBtn').innerHTML = 'View Results <i class="fa-solid fa-flag-checkered"></i>';
            } else {
                document.getElementById('nextBtn').innerHTML = 'Next <i class="fa-solid fa-arrow-right"></i>';
            }
            
            selectedAnswer = null;
            updateProgress();

            if (window.Prism) {
                Prism.highlightAll();
            }
        }

        function selectOption(index) {
            if (userAnswers.hasOwnProperty(currentQuestionIndex)) return;
            
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.classList.remove('selected'));
            options[index].classList.add('selected');
            
            selectedAnswer = index;
            document.getElementById('submitBtn').disabled = false;

            nextBtn.classList.remove('btn-primary');
        }

        function submitAnswer() {
            if (userAnswers.hasOwnProperty(currentQuestionIndex)) return;
            
            const question = questions[currentQuestionIndex];
            const isFIB = question.type === 'fib';
            const isPassageFib = question.type === 'passageFib';
            
            if (isPassageFib) {
                // Collect all passage blank answers
                const blankInputs = document.querySelectorAll('.passage-blank');
                const userAnswer = {};
                let allFilled = true;
                
                blankInputs.forEach(input => {
                    const index = parseInt(input.dataset.index);
                    const value = input.value.trim();
                    if (!value) {
                        allFilled = false;
                    }
                    userAnswer[index] = value;
                });
                
                if (!allFilled) return;
                
                userAnswers[currentQuestionIndex] = userAnswer;
                
                // Check each blank
                let allCorrect = true;
                const correctAnswers = question.answer;
                
                blankInputs.forEach(input => {
                    const index = parseInt(input.dataset.index);
                    const userVal = userAnswer[index];
                    const correctVal = correctAnswers[index];
                    
                    if (!correctVal) {
                        // If no correct answer defined for this blank, skip validation
                        input.disabled = true;
                        return;
                    }
                    
                    const isCorrect = Array.isArray(correctVal)
                        ? correctVal.some(ans => normalizeAnswer(ans) === normalizeAnswer(userVal))
                        : normalizeAnswer(correctVal) === normalizeAnswer(userVal);
                    
                    input.disabled = true;
                    input.classList.add(isCorrect ? 'correct' : 'incorrect');
                    
                    if (!isCorrect) {
                        allCorrect = false;
                        const answerDiv = document.getElementById(`passageAnswer${index}`);
                        const displayAnswer = Array.isArray(correctVal) ? correctVal.join(' or ') : correctVal;
                        answerDiv.innerHTML = `<span class="passage-blank-answer-label">Correct: </span>${displayAnswer}`;
                        answerDiv.classList.add('show');
                    }
                });
                
                if (allCorrect) {
                    correctCount++;
                } else {
                    incorrectCount++;
                }
            } else if (isFIB) {
                const fibInput = document.getElementById('fibInput');
                const userAnswer = fibInput.value.trim();
                
                if (!userAnswer) return;
                
                userAnswers[currentQuestionIndex] = userAnswer;
                
                const correctAnswer = Array.isArray(question.answer) ? question.answer[0] : question.answer;
                const isCorrect = Array.isArray(question.answer)
                    ? question.answer.some(ans => normalizeAnswer(ans) === normalizeAnswer(userAnswer))
                    : normalizeAnswer(correctAnswer) === normalizeAnswer(userAnswer);
                
                fibInput.disabled = true;
                fibInput.classList.add(isCorrect ? 'correct' : 'incorrect');
                
                if (isCorrect) {
                    correctCount++;
                } else {
                    incorrectCount++;
                    document.getElementById('fibAnswerText').textContent = 
                        Array.isArray(question.answer) ? question.answer.join(' or ') : correctAnswer;
                    document.getElementById('fibAnswer').classList.add('show');
                }
            } else {
                if (selectedAnswer === null) return;
                
                const options = document.querySelectorAll('.option');
                userAnswers[currentQuestionIndex] = selectedAnswer;
                options.forEach(opt => opt.classList.add('disabled'));
                
                if (selectedAnswer === question.answer) {
                    options[selectedAnswer].classList.add('correct');
                    correctCount++;
                } else {
                    options[selectedAnswer].classList.add('incorrect');
                    options[question.answer].classList.add('correct');
                    incorrectCount++;
                }
            }
            
            updateStats();
            saveProgress();
            
            const explanation = document.getElementById('explanation');
            // Show explanation only if it exists and is not empty
            if (question.explanation && question.explanation.trim() !== '') {
                document.getElementById('explanationText').innerHTML = formatCode(question.explanation);
                explanation.classList.add('show');
            } else {
                explanation.classList.remove('show');
            }
            
            document.getElementById('submitBtn').disabled = true;
            nextBtn.classList.add('btn-primary');
            if (currentQuestionIndex === questions.length - 1) {
                document.getElementById('nextBtn').innerHTML = 'View Results <i class="fa-solid fa-flag-checkered"></i>';
            }

            updateQuestionGrid();
        }

        function nextQuestion() {
            if (currentQuestionIndex < questions.length - 1) {
                currentQuestionIndex++;
                saveProgress();
                loadQuestion();
            } else if (Object.keys(userAnswers).length === questions.length) {
                showResults();
            }
        }

        function previousQuestion() {
            if (currentQuestionIndex > 0) {
                currentQuestionIndex--;
                saveProgress();
                loadQuestion();
            }
        }

        function updateStats() {
            document.getElementById('correct').textContent = correctCount;
            document.getElementById('incorrect').textContent = incorrectCount;
            
            // Calculate and display accuracy
            const totalAnswered = correctCount + incorrectCount;
            let accuracy = '--';
            if (totalAnswered > 0) {
                accuracy = Math.round((correctCount / totalAnswered) * 100) + '%';
            }
            document.getElementById('accuracy').textContent = accuracy;
        }

        function updateProgress() {
            const progress = ((currentQuestionIndex + 1) / questions.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function showResults() {
            document.getElementById('quizCard').style.display = 'none';
            document.getElementById('results').classList.add('show');
            
            const percentage = Math.round((correctCount / questions.length) * 100);
            
            document.getElementById('finalScore').textContent = `${correctCount}/${questions.length}`;
            document.getElementById('finalCorrect').textContent = correctCount;
            document.getElementById('finalIncorrect').textContent = incorrectCount;
            document.getElementById('percentage').textContent = percentage + '%';

            if (typeof confetti !== 'undefined') {
                confetti({
                    particleCount: 250,
                    spread: 120,
                    scalar: 2,
                    origin: { y: 0.6 }
                });
            }
        }

        function restartQuiz() {
            resetProgress();
        }

        function toggleMenu() {
            document.getElementById('menuOverlay').classList.toggle('active');
        }

        function initQuestionGrid() {
            const grid = document.getElementById('questionGrid');
            grid.innerHTML = '';
            
            questions.forEach((_, index) => {
                const item = document.createElement('div');
                item.className = 'question-item';
                item.textContent = index + 1;
                
                if (index === currentQuestionIndex) {
                    item.classList.add('current');
                }
                
                if (userAnswers.hasOwnProperty(index)) {
                    const question = questions[index];
                    const isFIB = question.type === 'fib';
                    const isPassageFib = question.type === 'passageFib';
                    let isCorrect;
                    
                    if (isPassageFib) {
                        // Check if all blanks are correct
                        const userAnswer = userAnswers[index];
                        const correctAnswers = question.answer;
                        if (!userAnswer || !correctAnswers) {
                            isCorrect = false;
                        } else {
                            isCorrect = Object.keys(correctAnswers).every(key => {
                                // Skip blank 0 - it's the example answer, not a user input
                                if (key === '0') return true;
                                
                                const correctVal = correctAnswers[key];
                                const userVal = userAnswer[key];
                                if (!userVal || !correctVal) return false; // Safety check
                                return Array.isArray(correctVal)
                                    ? correctVal.some(ans => normalizeAnswer(ans) === normalizeAnswer(userVal))
                                    : normalizeAnswer(correctVal) === normalizeAnswer(userVal);
                            });
                        }
                    } else if (isFIB) {
                        isCorrect = Array.isArray(question.answer)
                            ? question.answer.some(ans => normalizeAnswer(ans) === normalizeAnswer(userAnswers[index]))
                            : normalizeAnswer(question.answer) === normalizeAnswer(userAnswers[index]);
                    } else {
                        isCorrect = userAnswers[index] === question.answer;
                    }
                    
                    item.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
                
                item.onclick = () => {
                    currentQuestionIndex = index;
                    saveProgress();
                    loadQuestion();
                    toggleMenu();
                    updateQuestionGrid();
                };
                
                grid.appendChild(item);
            });
        }

        function updateQuestionGrid() {
            const items = document.querySelectorAll('.question-item');
            items.forEach((item, index) => {
                item.classList.remove('current', 'correct', 'incorrect');
                
                if (index === currentQuestionIndex) {
                    item.classList.add('current');
                }
                
                if (userAnswers.hasOwnProperty(index)) {
                    const question = questions[index];
                    const isFIB = question.type === 'fib';
                    const isPassageFib = question.type === 'passageFib';
                    let isCorrect;
                    
                    if (isPassageFib) {
                        // Check if all blanks are correct
                        const userAnswer = userAnswers[index];
                        const correctAnswers = question.answer;
                        if (!userAnswer || !correctAnswers) {
                            isCorrect = false;
                        } else {
                            isCorrect = Object.keys(correctAnswers).every(key => {
                                // Skip blank 0 - it's the example answer, not a user input
                                if (key === '0') return true;
                                
                                const correctVal = correctAnswers[key];
                                const userVal = userAnswer[key];
                                if (!userVal || !correctVal) return false; // Safety check
                                return Array.isArray(correctVal)
                                    ? correctVal.some(ans => normalizeAnswer(ans) === normalizeAnswer(userVal))
                                    : normalizeAnswer(correctVal) === normalizeAnswer(userVal);
                            });
                        }
                    } else if (isFIB) {
                        isCorrect = Array.isArray(question.answer)
                            ? question.answer.some(ans => normalizeAnswer(ans) === normalizeAnswer(userAnswers[index]))
                            : normalizeAnswer(question.answer) === normalizeAnswer(userAnswers[index]);
                    } else {
                        isCorrect = userAnswers[index] === question.answer;
                    }
                    
                    item.classList.add(isCorrect ? 'correct' : 'incorrect');
                }
            });
        }

        function printQuiz() {
            window.open(`/printQuiz?topic=${encodeURIComponent(topic)}`, '_blank');
        }

        // ── Search Sidebar ──────────────────────────────────────────────────

        const SIDEBAR_MIN_W = 240;
        const SIDEBAR_MAX_W = 600;
        let sidebarWidth = (() => {
            const stored = parseInt(localStorage.getItem('sidebarWidth'), 10);
            return isNaN(stored) ? 380 : Math.min(SIDEBAR_MAX_W, Math.max(SIDEBAR_MIN_W, stored));
        })();

        function isMobile() {
            return window.matchMedia('(max-width: 768px)').matches;
        }

        function toggleSearchSidebar() {
            const sidebar = document.getElementById('searchSidebar');
            if (sidebar.classList.contains('open')) {
                closeSearchSidebar();
            } else {
                openSearchSidebar();
            }
        }

        function openSearchSidebar() {
            const sidebar = document.getElementById('searchSidebar');
            if (!isMobile()) {
                sidebar.style.width = sidebarWidth + 'px';
                updateSidebarInnerMinWidths(sidebarWidth);
            }
            sidebar.classList.add('open');
            setTimeout(() => document.getElementById('searchInput').focus(), 50);
        }

        /** Close sidebar but keep the search query intact. */
        function closeSearchSidebar() {
            const sidebar = document.getElementById('searchSidebar');
            sidebar.classList.remove('open');
            if (!isMobile()) {
                sidebar.style.removeProperty('width');
            }
        }

        /** Close sidebar AND clear the query (X button / Escape). */
        function dismissSearchSidebar() {
            closeSearchSidebar();
            document.getElementById('searchInput').value = '';
            document.getElementById('searchResults').innerHTML = '';
            document.getElementById('searchMeta').textContent = '';
        }

        function updateSidebarInnerMinWidths(w) {
            document.querySelectorAll(
                '.search-sidebar-header, .search-input-wrapper, .search-meta, .search-results'
            ).forEach(el => { el.style.minWidth = w + 'px'; });
        }

        function initSidebarResize() {
            const handle = document.getElementById('sidebarResizeHandle');
            const sidebar = document.getElementById('searchSidebar');
            if (!handle || !sidebar) return;

            // Cache once to avoid repeated queries in the drag hot-path
            const innerEls = Array.from(document.querySelectorAll(
                '.search-sidebar-header, .search-input-wrapper, .search-meta, .search-results'
            ));

            handle.addEventListener('mousedown', (e) => {
                if (isMobile()) return;
                e.preventDefault();

                const startX = e.clientX;
                const startWidth = sidebar.offsetWidth;

                handle.classList.add('active');
                document.body.style.cursor = 'col-resize';
                document.body.style.userSelect = 'none';
                sidebar.style.transition = 'none';

                function onMouseMove(e) {
                    // Dragging left (smaller clientX) increases sidebar width
                    const newWidth = Math.min(
                        SIDEBAR_MAX_W,
                        Math.max(SIDEBAR_MIN_W, startWidth + (startX - e.clientX))
                    );
                    sidebar.style.width = newWidth + 'px';
                    sidebarWidth = newWidth;
                    innerEls.forEach(el => { el.style.minWidth = newWidth + 'px'; });
                }

                function onMouseUp() {
                    document.removeEventListener('mousemove', onMouseMove);
                    document.removeEventListener('mouseup', onMouseUp);
                    handle.classList.remove('active');
                    document.body.style.cursor = '';
                    document.body.style.userSelect = '';
                    sidebar.style.removeProperty('transition');
                    localStorage.setItem('sidebarWidth', sidebarWidth);
                }

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });
        }

        // Sync sidebar layout when viewport crosses the mobile breakpoint (debounced)
        window.addEventListener('resize', (() => {
            let t;
            return () => {
                clearTimeout(t);
                t = setTimeout(() => {
                    const sidebar = document.getElementById('searchSidebar');
                    if (!sidebar.classList.contains('open')) return;
                    if (isMobile()) {
                        sidebar.style.removeProperty('width');
                    } else {
                        sidebar.style.width = sidebarWidth + 'px';
                        updateSidebarInnerMinWidths(sidebarWidth);
                    }
                }, 100);
            };
        })());

        function escapeHtml(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function highlightText(text, query) {
            const escaped = escapeHtml(text);
            const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return escaped.replace(new RegExp(escapedQuery, 'gi'), match => `<span class="search-highlight">${match}</span>`);
        }

        function getSnippet(text, query, contextLen = 80) {
            const lower = text.toLowerCase();
            const idx = lower.indexOf(query.toLowerCase());
            if (idx === -1) return text.slice(0, contextLen * 2);
            const start = Math.max(0, idx - contextLen);
            const end = Math.min(text.length, idx + query.length + contextLen);
            const prefix = start > 0 ? '…' : '';
            const suffix = end < text.length ? '…' : '';
            return prefix + text.slice(start, end) + suffix;
        }

        function runSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const resultsContainer = document.getElementById('searchResults');
            const metaEl = document.getElementById('searchMeta');

            resultsContainer.innerHTML = '';
            metaEl.textContent = '';

            if (!query || query.length < 2) {
                if (query.length === 1) metaEl.textContent = 'Type at least 2 characters…';
                return;
            }

            if (!questions || questions.length === 0) {
                metaEl.textContent = 'Questions not loaded yet.';
                return;
            }

            const matches = [];

            questions.forEach((q, index) => {
                const searchableFields = [];

                // Question text
                if (q.question) searchableFields.push({ label: 'question', text: q.question });

                // MCQ options
                if (Array.isArray(q.options)) {
                    q.options.forEach((opt, i) => {
                        searchableFields.push({ label: `option ${String.fromCharCode(65 + i)}`, text: opt });
                    });
                }

                // Passage text
                if (q.passage) searchableFields.push({ label: 'passage', text: q.passage });

                // Explanation
                if (q.explanation) searchableFields.push({ label: 'explanation', text: q.explanation });

                // Answers (for fib / passageFib)
                if (q.answer) {
                    if (typeof q.answer === 'string') {
                        searchableFields.push({ label: 'answer', text: q.answer });
                    } else if (Array.isArray(q.answer)) {
                        q.answer.forEach(a => searchableFields.push({ label: 'answer', text: String(a) }));
                    } else if (typeof q.answer === 'object') {
                        Object.values(q.answer).forEach(a => {
                            if (Array.isArray(a)) a.forEach(v => searchableFields.push({ label: 'answer', text: String(v) }));
                            else searchableFields.push({ label: 'answer', text: String(a) });
                        });
                    }
                }

                const fieldMatches = searchableFields.filter(f => f.text.toLowerCase().includes(query.toLowerCase()));
                if (fieldMatches.length > 0) {
                    matches.push({ index, question: q, fieldMatches });
                }
            });

            if (matches.length === 0) {
                resultsContainer.innerHTML = `<div class="search-no-results">No results for "<strong>${escapeHtml(query)}</strong>"</div>`;
                metaEl.textContent = '0 results';
                return;
            }

            metaEl.textContent = `${matches.length} question${matches.length !== 1 ? 's' : ''} found`;

            matches.forEach(({ index, fieldMatches }) => {
                const item = document.createElement('div');
                item.className = 'search-result-item';

                const primaryField = fieldMatches[0];
                const snippet = getSnippet(primaryField.text, query);
                const highlighted = highlightText(snippet, query);

                item.innerHTML = `
                    <div class="search-result-qnum">Question ${index + 1}</div>
                    <div class="search-result-snippet">${highlighted}</div>
                `;

                item.addEventListener('click', () => {
                    currentQuestionIndex = index;
                    saveProgress();
                    loadQuestion();
                    updateQuestionGrid();
                    // On mobile the sidebar is full-screen; close it (but keep query)
                    if (isMobile()) {
                        closeSearchSidebar();
                    }
                });

                resultsContainer.appendChild(item);
            });
        }

        // Initialize
        loadQuestions();
        initSidebarResize();
    </script>
</body>
